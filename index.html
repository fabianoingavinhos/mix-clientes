<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Clientes — Consulta</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js"></script>
<script src="logo.js"></script>
<script src="common.js"></script>
<style>
  .meta-box { margin:4px 0 10px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .meta-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:14px; }
  .metas-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin:10px 0 0; }
  .mk { background:#fafbfc; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .mk .l { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; }
  .mk .v { font-size:17px; font-weight:700; margin-top:3px; }
  .mk .v small { font-size:12px; font-weight:400; color:var(--muted); }
  .mk .s { font-size:12.5px; margin-top:3px; }
  .mk .bar { height:6px; background:#e9edf2; border-radius:4px; overflow:hidden; margin-top:6px; }
  .mk .bar > div { height:100%; background:var(--brand); }
  .mk.ok .bar > div { background:var(--ok); } .mk.ok .s { color:var(--ok); font-weight:600; }
  .mk.warn .bar > div { background:var(--warn); } .mk.warn .s { color:var(--warn); }
  .mk.bad .s { color:var(--bad); }
  .msg.warn { background:var(--warn-soft); color:var(--warn); }
  .msg .btn { vertical-align:middle; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(async () => {
  const { sb, configured, cfg, fmtBRL, fmtNum, fmtInt, fmtDate, statusClass, esc, el, showMsg } = Mix;
  const root = el("root");

  if (!configured) {
    root.innerHTML = `<div class="wrap"><div class="card card-pad"><h1>Configuração pendente</h1>
      <p class="sub">Edite o arquivo <span class="mono">config.js</span> e preencha SUPABASE_URL e SUPABASE_ANON_KEY com os dados do seu projeto Supabase. Depois execute <span class="mono">schema.sql</span> no SQL Editor.</p></div></div>`;
    return;
  }

  // ---------------- LOGIN ----------------
  function renderLogin() {
    root.innerHTML = `
      <div class="login-wrap">
        <form class="card login-card" id="loginForm" autocomplete="on">
          <div class="brand"><div class="mark">M</div><div><b>${esc(cfg.EMPRESA || "Mix Clientes")}</b><small>Consulta de mix por cliente</small></div></div>
          <div class="field"><label>Usuário</label><input type="text" id="lUser" autocomplete="username" autofocus required></div>
          <div class="field"><label>Senha</label><input type="password" id="lPass" autocomplete="current-password" required></div>
          <div id="lMsg"></div>
          <button class="btn block" id="lBtn" type="submit">Entrar</button>
        </form>
      </div>`;
    el("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = el("lBtn"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Entrando…';
      showMsg(el("lMsg"), "");
      try {
        await Mix.login(el("lUser").value, el("lPass").value);
        const ctx = await Mix.getSessionProfile();
        if (!ctx) throw new Error("Usuário sem perfil cadastrado. Fale com o administrador.");
        renderApp(ctx);
      } catch (err) {
        showMsg(el("lMsg"), err.message, "err");
        btn.disabled = false; btn.textContent = "Entrar";
      }
    });
  }

  // ---------------- APP ----------------
  const isVendedor = () => state.profile?.role === "vendedor";
  let restrito = false; // proteção anticópia ativa (vendedor): sem exportar mix, busca exige termo
  let state = { profile: null, results: [], selected: null, mix: [], filter: "", status: "", sort: { key: "valor_total_comprado", dir: -1 }, pedido: {}, estoque: {}, metas: new Map(), metaRef: null, vendas: [] };

  // Rascunho de pedido por cliente (fica salvo no navegador)
  const pedidoKey = (codcli) => `mix_pedido_${codcli}`;
  function loadPedido(codcli) {
    try {
      const o = JSON.parse(localStorage.getItem(pedidoKey(codcli)) || "{}");
      return o && o.pedido ? o : { pedido: o || {}, estoque: {} }; // compatível com o formato antigo
    } catch { return { pedido: {}, estoque: {} }; }
  }
  function savePedido() { try { if (state.selected) localStorage.setItem(pedidoKey(state.selected.codcli), JSON.stringify({ pedido: state.pedido, estoque: state.estoque })); } catch {} }
  // Modo "apenas listagem" (lembrado no navegador)
  let listMode = false; try { listMode = localStorage.getItem("mix_listmode") === "1"; } catch {}

  async function renderApp(ctx) {
    state.profile = ctx.profile;
    if (isVendedor()) state.sort = { key: "dias_sem_comprar", dir: 1 };
    const p = ctx.profile;
    const scope = p.role === "admin" ? "Todos os clientes da base"
      : p.role === "supervisor" ? `Clientes da sua equipe (supervisor ${p.cod_supervisor ?? "—"})`
      : `Seus clientes (vendedor ${p.cod_vendedor ?? "—"})`;

    root.innerHTML = Mix.renderTopbar(p, "app") + `
      <div class="wrap">
        <div class="grid-2" id="grid">
          <div class="left">
            <div class="card card-pad">
              <h1>Consultar mix</h1>
              <p class="sub">${esc(scope)} · <span id="metaInfo" class="muted"></span></p>
              <div class="searchbox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" id="q" placeholder="Código, nome, fantasia ou CNPJ…" autocomplete="off" autofocus>
              </div>
              <div id="results" class="results"></div>
            </div>
          </div>
          <div id="detail"></div>
        </div>
      </div>`;
    Mix.bindTopbar();
    restrito = Mix.protegerDados(p);
    renderDetail();
    loadMeta();
    loadMetas();
    registrar("acesso");

    const q = el("q");
    let t;
    q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => search(q.value), 250); });
    q.addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(t); search(q.value); } });
    // Aberto a partir do roteiro (index.html?cli=CODIGO): busca e abre o cliente
    const cli = new URLSearchParams(location.search).get("cli");
    if (cli && /^\d+$/.test(cli)) { q.value = cli; await search(cli); if (state.results.length) selectClient(state.results[0].codcli); }
    else search("");
  }

  // Registro de uso (silencioso): acesso ao sistema e consulta de cliente
  let ultimoAcessoLog = 0;
  function registrar(tipo, codcli = null) {
    if (tipo === "acesso") { if (Date.now() - ultimoAcessoLog < 60000) return; ultimoAcessoLog = Date.now(); }
    sb.from("acessos").insert({ user_id: state.profile.id, tipo, codcli }).then(() => {}, () => {});
  }

  async function loadMeta() {
    const { data } = await sb.from("mix_meta").select("*").eq("id", 1).maybeSingle();
    if (data?.atualizado_em) {
      const d = new Date(data.atualizado_em);
      el("metaInfo").textContent = `base atualizada em ${d.toLocaleDateString("pt-BR")} ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
    } else el("metaInfo").textContent = "nenhuma planilha carregada ainda";
  }

  // Metas do mês (venda do ano passado + %): uma linha por cliente, usada na lista e no detalhe
  async function loadMetas() {
    const { data, error } = await sb.rpc("metas_clientes");
    if (error || !data) return; // schema_metas.sql ainda não executado ou sem dados
    state.metas = new Map(data.map((r) => [r.codcli, { ...r, m: Mix.calcMeta(r) }]));
    state.metaRef = data[0] ? { mes_atual: data[0].mes_atual, mes_base: data[0].mes_base, modo: data[0].modo } : null;
    if (state.results.length) renderResults();
    if (state.selected) { const box = el("metaBox"); if (box) box.outerHTML = renderMetaBox(); bindMetaBox(); }
  }
  function faltaBadge(codcli) {
    const r = state.metas.get(codcli); if (!r) return "";
    const m = r.m;
    if (m.status === "batida") return `<span class="badge ok">meta batida</span>`;
    if (m.status === "sem_base") return "";
    return `<span class="badge ${Mix.metaBadge(m.status)}" title="${esc(m.msg)}">falta ${fmtBRL.format(m.falta.valor)}${m.falta.mix ? " · " + m.falta.mix + " mix" : ""}</span>`;
  }

  let lastQuery = null;
  async function search(q) {
    q = q.trim();
    lastQuery = q;
    const box = el("results");
    if (restrito && q.length < 2) {
      state.results = [];
      box.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><div>Digite o código, nome ou fantasia do cliente para buscar.</div></div>`;
      return;
    }
    const { data, error } = await sb.rpc("buscar_clientes", { q, limite: restrito ? 30 : 80 });
    if (lastQuery !== q) return; // resposta antiga
    if (error) { box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    state.results = data || [];
    renderResults();
  }

  function renderResults() {
    const box = el("results");
    if (!state.results.length) {
      box.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><div>Nenhum cliente encontrado</div></div>`;
      return;
    }
    box.innerHTML = state.results.map((c) => `
      <button class="result ${state.selected?.codcli === c.codcli ? "active" : ""}" data-cod="${c.codcli}">
        <div class="name">${esc(c.cliente)}</div>
        ${c.fantasia ? `<div class="fant">${esc(c.fantasia)}</div>` : ""}
        <div class="meta">
          <span class="cod">${c.codcli}</span>
          <span>${esc(c.cidade || "")}${c.uf ? "/" + esc(c.uf) : ""}</span>
          <span>${c.produtos} itens</span>
          ${isVendedor() ? "" : `<span>${fmtBRL.format(c.valor_total || 0)}</span>`}
          ${state.profile.role !== "vendedor" ? `<span>· ${esc(c.vendedor || "")}</span>` : ""}
          ${faltaBadge(c.codcli)}
        </div>
      </button>`).join("") + (state.results.length >= (restrito ? 30 : 80) ? `<div class="muted" style="text-align:center;font-size:12px;padding:6px">Mostrando ${restrito ? 30 : 80} primeiros — refine a busca</div>` : "");
    box.querySelectorAll(".result").forEach((b) => b.addEventListener("click", () => selectClient(+b.dataset.cod)));
  }

  async function selectClient(codcli) {
    state.selected = state.results.find((r) => r.codcli === codcli) || { codcli };
    state.filter = ""; state.status = "";
    renderResults();
    el("grid").classList.add("has-sel");
    window.scrollTo({ top: 0 });
    el("detail").innerHTML = `<div class="card card-pad"><div class="empty"><span class="spinner dark"></span></div></div>`;
    const { data, error } = await sb.from("mix").select("*").eq("codcli", codcli).limit(5000);
    if (error) { el("detail").innerHTML = `<div class="card card-pad"><div class="msg err">${esc(error.message)}</div></div>`; return; }
    state.mix = data || [];
    state.periodicidade = null;
    sb.from("roteiro").select("periodicidade").eq("codcli", codcli).then(({ data: rt }) => {
      const per = (rt || []).map((r) => r.periodicidade).filter((v) => v > 0);
      state.periodicidade = per.length ? Math.min(...per) : null;
    }, () => {});
    registrar("consulta", codcli);
    ({ pedido: state.pedido, estoque: state.estoque } = loadPedido(codcli));
    state.vendas = [];
    sb.from("vendas").select("origem,codprod,descricao,embalagem,unidade,fornecedor,mes,qtd,valor").eq("codcli", codcli).limit(5000).then(({ data: vd }) => {
      if (state.selected?.codcli !== codcli) return;
      state.vendas = vd || [];
      const b = el("pbMeta"); if (b) b.disabled = !state.vendas.length;
    }, () => {});
    renderDetail();
  }

  // ---------- Meta do cliente (venda do mesmo mês do ano passado + %) ----------
  function renderMetaBox() {
    if (!state.selected) return "";
    const r = state.metas.get(state.selected.codcli);
    const ref = state.metaRef;
    if (!r) return state.metas.size ? `<div id="metaBox" class="meta-box"><div class="msg info" style="margin:0">Sem venda deste cliente no ano passado nem no mês atual — sem meta calculada.</div></div>` : `<div id="metaBox"></div>`;
    const m = r.m, pct = Mix.METAS_PCT;
    const item = (label, meta, real, fmt, pctLabel) => {
      const falta = Math.max(0, meta - real), p = meta > 0 ? real / meta : (real > 0 ? 1 : 0);
      const cls = meta <= 0 ? "" : falta <= 0 ? "ok" : p >= 0.8 ? "warn" : "bad";
      return `<div class="mk ${cls}"><div class="l">${label}${isVendedor() ? "" : ` <span class="muted">(+${pctLabel}%)</span>`}</div>
        <div class="v">${fmt(real)} <small>/ ${fmt(meta)}</small></div>
        <div class="s">${meta <= 0 ? "sem base" : falta <= 0 ? "✔ batida" : `falta <b>${fmt(falta)}</b>`}</div>
        <div class="bar"><div style="width:${Math.min(100, Math.round(p * 100))}%"></div></div></div>`;
    };
    return `<div id="metaBox" class="meta-box">
      <div class="meta-head"><b>🎯 Meta de ${esc(Mix.nomeMes(r.mes_atual))}</b>
        <span class="muted">base: ${r.modo === "mes" ? "venda de " + esc(Mix.nomeMes(r.mes_base)) : r.modo === "media" ? "média mensal do ano passado" : "—"}</span>
        <a href="metas.html" class="muted" style="margin-left:auto;font-size:12.5px">ver todas as metas →</a></div>
      <div class="metas-grid">
        ${item("Financeiro", m.meta.valor, m.real.valor, (v) => fmtBRL.format(v), pct.valor)}
        ${item("Quantidade", m.meta.qtd, m.real.qtd, (v) => fmtInt.format(v), pct.qtd)}
        ${item("Mix", m.meta.mix, m.real.mix, (v) => fmtInt.format(v), pct.mix)}
      </div>
      <div class="msg ${m.status === "batida" ? "ok" : m.status === "quase" ? "warn" : "info"}" style="margin:8px 0 0">${esc(m.msg)}${m.status !== "batida" && m.status !== "sem_base" ? ` <button class="btn sm" id="metaSugerir" style="margin-left:8px">🎯 Sugerir pedido pela meta</button>` : ""}</div>
    </div>`;
  }
  function bindMetaBox() { el("metaSugerir")?.addEventListener("click", sugerirPelaMeta); }

  /**
   * Monta a sugestão de pedido a partir da meta: para cada produto vendido no mês base do ano passado,
   * alvo = qtd × (1 + %qtd), descontado o que já foi comprado no mês atual; se ainda faltar mix,
   * completa com os produtos mais vendidos ao cliente nos outros meses do ano passado.
   */
  function montarSugestaoMeta() {
    const r = state.metas.get(state.selected.codcli); if (!r) return null;
    const pct = Mix.METAS_PCT, m = r.m;
    const hist = state.vendas.filter((v) => v.origem === "hist"), atual = state.vendas.filter((v) => v.origem === "atual" && v.mes === r.mes_atual);
    const nMeses = new Set(hist.map((v) => v.mes)).size || 1;
    const base = new Map(); // codprod -> { qtd, valor, info }
    const addBase = (v, div) => { const e = base.get(v.codprod) || { qtd: 0, valor: 0, info: v }; e.qtd += (+v.qtd || 0) / div; e.valor += (+v.valor || 0) / div; base.set(v.codprod, e); };
    if (r.modo === "mes") hist.filter((v) => v.mes === r.mes_base).forEach((v) => addBase(v, 1)); else hist.forEach((v) => addBase(v, nMeses));
    const compradoMes = new Map(); atual.forEach((v) => compradoMes.set(v.codprod, (compradoMes.get(v.codprod) || 0) + (+v.qtd || 0)));
    const itens = []; // { codprod, qtd, motivo, info }
    for (const [codprod, e] of base) {
      if (e.qtd <= 0) continue;
      const alvo = Math.ceil(e.qtd * (1 + pct.qtd / 100) - 1e-9), falta = alvo - (compradoMes.get(codprod) || 0);
      if (falta > 0) itens.push({ codprod, qtd: falta, motivo: "ano passado", info: e.info });
    }
    // Completa o mix com produtos de outros meses do ano passado
    const cobertos = new Set([...compradoMes.keys()].filter((c) => compradoMes.get(c) > 0)); itens.forEach((i) => cobertos.add(i.codprod));
    let faltaMix = m.meta.mix - cobertos.size;
    if (faltaMix > 0) {
      const outros = new Map();
      hist.forEach((v) => { if (cobertos.has(v.codprod) || (+v.qtd || 0) <= 0) return; const e = outros.get(v.codprod) || { qtd: 0, valor: 0, meses: 0, info: v }; e.qtd += +v.qtd; e.valor += +v.valor || 0; e.meses++; outros.set(v.codprod, e); });
      [...outros.entries()].sort((a, b) => b[1].valor - a[1].valor).slice(0, faltaMix)
        .forEach(([codprod, e]) => itens.push({ codprod, qtd: Math.max(1, Math.ceil(e.qtd / e.meses)), motivo: "completar mix", info: e.info }));
    }
    return { itens, r };
  }

  function sugerirPelaMeta() {
    if (!state.vendas.length) return Mix.toast("Ainda carregando as vendas deste cliente — tente novamente em instantes.", "err");
    const sug = montarSugestaoMeta();
    if (!sug || !sug.itens.length) return Mix.toast("Nada a sugerir: o que foi comprado no mês já cobre a meta deste cliente.", "ok");
    const { itens, r } = sug;
    const nAno = itens.filter((i) => i.motivo === "ano passado").length, nMix = itens.length - nAno, unid = itens.reduce((s, i) => s + i.qtd, 0);
    const foraMix = itens.filter((i) => !state.mix.some((x) => x.codprod === i.codprod)).length;
    Mix.openModal(`
      <h3>Sugerir pedido pela meta</h3>
      <p class="sub" style="margin:0 0 10px">${esc(r.m.msg)}</p>
      <p class="sub" style="margin:0 0 10px">Serão sugeridos <b>${itens.length} produtos</b> (${fmtInt.format(unid)} unidades): <b>${nAno}</b> comprados em ${esc(Mix.nomeMes(r.mes_base) || "ano passado")} ${isVendedor() ? "" : ` com <b>+${Mix.METAS_PCT.qtd}%</b>`}, descontando o já comprado neste mês${nMix ? `, e <b>${nMix}</b> dos outros meses do ano passado para completar o mix` : ""}.${foraMix ? ` ${foraMix} deles não estão no mix atual e serão incluídos na lista.` : ""}</p>
      <div class="field"><label>Quantidades já digitadas</label>
        <select id="metaSubst"><option value="1">Substituir pelas da meta</option><option value="0">Manter (só preencher vazias)</option></select></div>
      <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="metaOk">Aplicar</button></div>`);
    el("metaOk").onclick = () => {
      const subst = el("metaSubst").value === "1";
      let n = 0;
      if (subst) state.pedido = {};
      for (const i of itens) {
        if (!subst && state.pedido[i.codprod] > 0) continue;
        if (!state.mix.some((x) => x.codprod === i.codprod)) {
          state.mix.push({ codcli: state.selected.codcli, codprod: i.codprod, descricao: i.info.descricao, embalagem: i.info.embalagem, unidade: i.info.unidade, fornecedor: i.info.fornecedor, status_ultima_compra: "ANO PASSADO (meta)", _extra: true });
        }
        state.pedido[i.codprod] = i.qtd; n++;
      }
      savePedido(); Mix.closeModal(); renderTable(); updatePedidoBar();
      Mix.toast(`${n} produtos sugeridos pela meta. Revise as quantidades antes de enviar.`);
    };
  }

  function renderDetail() {
    const d = el("detail");
    if (!state.selected) {
      d.innerHTML = `<div class="card card-pad"><div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <div>Busque e selecione um cliente para ver o mix de produtos.</div></div></div>`;
      return;
    }
    const rows = state.mix;
    const c = rows[0] || state.selected;
    const total = rows.reduce((s, r) => s + (+r.valor_total_comprado || 0), 0);
    const qtd = rows.reduce((s, r) => s + (+r.qtd_total_comprada || 0), 0);
    const pedidos = rows.reduce((s, r) => s + (+r.qtd_pedidos || 0), 0);
    const ultima = rows.reduce((m, r) => (r.ultima_compra && (!m || r.ultima_compra > m) ? r.ultima_compra : m), null);
    const ativos = rows.filter((r) => (r.dias_sem_comprar ?? 9999) <= 90).length;
    const fornecedores = new Set(rows.map((r) => r.fornecedor)).size;
    const statuses = [...new Set(rows.map((r) => r.status_ultima_compra).filter(Boolean))].sort((a, b) => ordStatus(a) - ordStatus(b));

    d.innerHTML = `
      <div class="card card-pad">
        <div class="client-head">
          <div>
            <h2>${esc(c.cliente)}</h2>
            ${c.fantasia ? `<div class="fant">${esc(c.fantasia)}</div>` : ""}
            <div class="meta">
              <span class="mono">Cód. ${c.codcli}</span>
              ${c.cnpj_cpf ? `<span>${esc(c.cnpj_cpf)}</span>` : ""}
              <span>${esc(c.cidade || "")}${c.uf ? "/" + esc(c.uf) : ""}</span>
              <span>Vendedor: <b>${esc(c.vendedor || "—")}</b></span>
              <span>Supervisor: <b>${esc(c.supervisor || "—")}</b></span>
            </div>
          </div>
          <div class="row">
            <button class="btn ghost sm mobile-only" id="btnBack">← Voltar</button>
            ${restrito ? "" : `<button class="btn ghost sm" id="btnExport">⬇ Exportar Excel</button>`}
          </div>
        </div>

        <div class="kpis">

        <div class="pedido-bar" id="pedidoBar">

    el("fMix").addEventListener("input", (e) => { state.filter = e.target.value; renderTable(); });
    el("fStatus").addEventListener("change", (e) => { state.status = e.target.value; renderTable(); });
    el("btnExport")?.addEventListener("click", exportExcel);
    el("tableWrap").addEventListener("input", (e) => {
      const isQtd = e.target.classList.contains("qtd"), isEst = e.target.classList.contains("est");
      if (!isQtd && !isEst) return;
      const cod = e.target.dataset.cod, v = parseInt(e.target.value, 10);
      const map = isQtd ? state.pedido : state.estoque;
      if (!isNaN(v) && v >= 0 && e.target.value !== "") map[cod] = v; else delete map[cod];
      if (isQtd) e.target.closest("tr")?.classList.toggle("has-qtd", v > 0);
      savePedido(); updatePedidoBar();
    });
    el("tableWrap").addEventListener("keydown", (e) => {
      if ((e.target.classList.contains("qtd") || e.target.classList.contains("est")) && e.key === "Enter") { // Enter pula para o próximo campo
        e.preventDefault();
        const all = [...el("tableWrap").querySelectorAll("input.qtd, input.est")]; const i = all.indexOf(e.target);
        if (all[i + 1]) { all[i + 1].focus(); all[i + 1].select(); }

    el("fSort").addEventListener("change", (e) => { const [k, d] = e.target.value.split("|"); state.sort = { key: k, dir: +d }; renderTable(); });
    renderTable();
  }

  // Colunas da tabela. "v: true" = visível também para o perfil vendedor.
  const ALL_COLS = [
    { key: "codprod", label: "Cód.", num: true, v: true, cell: (r) => `<td class="num mono">${r.codprod ?? ""}</td>` },
    { key: "descricao", label: "Produto", v: true, cell: (r) => `<td class="prod"><div class="desc">${esc(r.descricao)}</div><div class="small">${esc(r.embalagem || "")} ${r.unidade ? "· " + esc(r.unidade) : ""}</div></td>` },
    { key: "estoque_cli", label: "Estoque", num: true, v: true, list: true, cell: (r) => `<td class="num inp-cell est-cell"><input type="number" min="0" step="1" inputmode="numeric" class="est" data-cod="${r.codprod}" value="${state.estoque[r.codprod] ?? ""}" placeholder="—" aria-label="Estoque no cliente"></td>` },
    { key: "pedido", label: "Qtd sugerida", num: true, v: true, list: true, cell: (r) => `<td class="num inp-cell qtd-cell"><input type="number" min="0" step="1" inputmode="numeric" class="qtd" data-cod="${r.codprod}" value="${state.pedido[r.codprod] ?? ""}" placeholder="0" aria-label="Quantidade sugerida"></td>` },
    { key: "fornecedor", label: "Fornecedor", cell: (r) => `<td class="small forn">${esc(r.fornecedor || "")}</td>` },
    { key: "ultima_compra", label: "Última compra", v: true, cell: (r) => `<td>${fmtDate(r.ultima_compra)}<div class="small">1ª: ${fmtDate(r.primeira_compra_periodo)}</div></td>` },
    { key: "dias_sem_comprar", label: "Dias s/ comprar", num: true, v: true, cell: (r) => `<td class="num">${r.dias_sem_comprar ?? ""}</td>` },
    { key: "status_ultima_compra", label: "Status", v: true, cell: (r) => `<td><span class="badge ${statusClass(r.status_ultima_compra, r.dias_sem_comprar)}">${esc(r.status_ultima_compra || "—")}</span></td>` },
    { key: "qtd_pedidos", label: "Pedidos", num: true, cell: (r) => `<td class="num">${r.qtd_pedidos ?? ""}</td>` },
    { key: "qtd_total_comprada", label: "Qtd total", num: true, cell: (r) => `<td class="num">${r.qtd_total_comprada != null ? fmtNum.format(r.qtd_total_comprada) : ""}</td>` },
    { key: "valor_total_comprado", label: "Valor total", num: true, cell: (r) => `<td class="num"><b>${r.valor_total_comprado != null ? fmtBRL.format(r.valor_total_comprado) : ""}</b></td>` },
    { key: "preco_medio", label: "Preço médio", num: true, cell: (r) => `<td class="num">${r.preco_medio != null ? fmtBRL.format(r.preco_medio) : ""}</td>` },
    { key: "ultimo_preco_pago", label: "Último preço", num: true, cell: (r) => `<td class="num">${r.ultimo_preco_pago != null ? fmtBRL.format(r.ultimo_preco_pago) : ""}</td>` },
    { key: "estoque_disponivel_filial_1", label: "Estoque disp.", num: true, cell: (r) => `<td class="num ${(r.estoque_disponivel_filial_1 ?? 1) <= 0 ? "muted" : ""}">${r.estoque_disponivel_filial_1 != null ? fmtInt.format(r.estoque_disponivel_filial_1) : ""}</td>` },
  ];
  const visibleCols = () => {
    if (listMode) return ALL_COLS.filter((c) => c.list || c.key === "codprod" || c.key === "descricao");
    const cols = isVendedor() ? ALL_COLS.filter((c) => c.v) : ALL_COLS;
    return cols.filter((c) => c.key !== "estoque_cli"); // estoque só no modo listagem
  };

  function filteredRows() {
    const f = state.filter.trim().toLowerCase();
    let rows = state.mix.filter((r) =>
      (!f || (r.descricao || "").toLowerCase().includes(f) || (r.fornecedor || "").toLowerCase().includes(f) || String(r.codprod).includes(f)) &&
      (!state.status || r.status_ultima_compra === state.status));
    const { key, dir } = state.sort;
    rows.sort((a, b) => {
      const pick = (r) => key === "pedido" ? (state.pedido[r.codprod] ?? null) : key === "estoque_cli" ? (state.estoque[r.codprod] ?? null) : r[key];
      const va = pick(a), vb = pick(b);
      if (va == null && vb == null) return 0;
      if (va == null) return 1; if (vb == null) return -1;
      if (typeof va === "number" || !isNaN(+va) && !isNaN(+vb) && va !== "" && vb !== "") return (+va - +vb) * dir;
      return String(va).localeCompare(String(vb), "pt-BR") * dir;
    });
    return rows;
  }

  function renderTable() {
    const rows = filteredRows();
    const COLS = visibleCols();
    el("countInfo").textContent = `${rows.length} de ${state.mix.length} itens`;
    el("tableWrap").classList.toggle("list-mode", listMode);
    el("tableWrap").innerHTML = `
      <table>
        <thead><tr>${COLS.map((c) => `<th class="${c.num ? "num" : ""}" data-key="${c.key}">${c.label}${state.sort.key === c.key ? `<span class="arrow">${state.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr class="${state.pedido[r.codprod] > 0 ? "has-qtd" : ""}">${COLS.map((c) => c.cell(r).replace("<td", `<td data-l="${c.label}"`)).join("")}</tr>`).join("")}
        </tbody>
      </table>`;
    el("tableWrap").querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {
      const k = th.dataset.key;
      state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: ALL_COLS.find((c) => c.key === k).num ? -1 : 1 };
      renderTable();
    }));
  }

  function exportExcel() {
    const rows = filteredRows();
    const c = state.mix[0] || state.selected;
    const data = rows.map((r) => isVendedor() ? {
      "Cód. Produto": r.codprod, "Produto": r.descricao, "Embalagem": r.embalagem,
      "Última compra": fmtDate(r.ultima_compra), "Dias sem comprar": r.dias_sem_comprar, "Status": r.status_ultima_compra,
    } : {
      "Cód. Produto": r.codprod, "Produto": r.descricao, "Embalagem": r.embalagem, "Unidade": r.unidade, "Fornecedor": r.fornecedor,
      "Primeira compra": fmtDate(r.primeira_compra_periodo), "Última compra": fmtDate(r.ultima_compra), "Dias sem comprar": r.dias_sem_comprar,
      "Status": r.status_ultima_compra, "Pedidos": r.qtd_pedidos, "Notas": r.qtd_notas, "Qtd total": r.qtd_total_comprada,
      "Valor total": r.valor_total_comprado, "Preço médio": r.preco_medio, "Último preço": r.ultimo_preco_pago,
      "Estoque disponível": r.estoque_disponivel_filial_1,
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Mix");
    XLSX.writeFile(wb, `mix_${c.codcli}_${(c.fantasia || c.cliente || "cliente").replace(/[^\w]+/g, "_").slice(0, 40)}.xlsx`);
  }

  // ---------- Sugestão de pedido ----------
  function pedidoRows() {
    return state.mix.filter((r) => state.pedido[r.codprod] > 0)
      .map((r) => ({ ...r, qtd: state.pedido[r.codprod], est: state.estoque[r.codprod] ?? null }))
      .sort((a, b) => String(a.descricao).localeCompare(String(b.descricao), "pt-BR"));
  }
  function updatePedidoBar() {
    const rows = pedidoRows();
    const bar = el("pedidoBar"); if (!bar) return;
    el("pbItens").textContent = rows.length;
    el("pbUnid").textContent = fmtInt.format(rows.reduce((s, r) => s + r.qtd, 0));
    bar.classList.toggle("active", rows.length > 0);
    el("pbExcel").disabled = el("pbPdf").disabled = el("pbLimpar").disabled = rows.length === 0;
  }
  // ---------- Cálculo automático da quantidade sugerida ----------
  // Consumo diário = qtd total comprada / dias em que o produto esteve "ativo" no período
  // (da 1ª à última compra + um intervalo médio entre pedidos). Sugestão = consumo × dias de cobertura − estoque informado.
  function calcularSugestao(r, cobertura) {
    const qtd = +r.qtd_total_comprada || 0, ped = +r.qtd_pedidos || 0;
    if (qtd <= 0 || !r.primeira_compra_periodo || !r.ultima_compra) return { qtd: 0, motivo: "sem histórico" };
    const span = Math.max(0, diasEntre(r.primeira_compra_periodo, r.ultima_compra));
    const intervalo = ped > 1 ? span / (ped - 1) : 30;              // dias entre pedidos
    const diasAtivos = Math.max(30, span + intervalo);               // janela de consumo
    const consumoDia = qtd / diasAtivos;
    const semComprar = r.dias_sem_comprar ?? diasDesde(r.ultima_compra);
    if (semComprar > Math.max(180, intervalo * 3)) return { qtd: 0, motivo: "parou de comprar", consumoDia, intervalo };
    const estoque = state.estoque[r.codprod] ?? 0;
    let sug = Math.ceil(consumoDia * cobertura - estoque);
    if (sug < 0) sug = 0;
    const disp = r.estoque_disponivel_filial_1;
    if (sug > 0 && disp != null && disp >= 0 && sug > disp) sug = disp;   // limita ao estoque disponível da filial
    return { qtd: sug, consumoDia, intervalo, motivo: sug ? "" : "estoque cobre o período" };
  }
  function diasEntre(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }

  function abrirCalculo() {
    if (!state.mix.length) return;
    const per = state.periodicidade;
    const padrao = per ? per + 7 : 30;
    Mix.openModal(`
      <h3>Calcular quantidade sugerida</h3>
      <p class="sub" style="margin:0 0 10px">Usa o histórico de cada produto (quantidade comprada, nº de pedidos e datas) para estimar o consumo e sugerir a quantidade para os próximos dias, descontando o estoque que você informou.</p>
      <div class="form-grid">
        <div class="field"><label>Cobertura (dias)</label><input type="number" id="calcDias" min="7" max="120" value="${padrao}">
          <span class="muted" style="font-size:12px">${per ? `visita do promotor a cada ${per} dias + 7 de segurança` : "sem roteiro cadastrado — padrão 30 dias"}</span></div>
        <div class="field"><label>Quantidades já digitadas</label>
          <select id="calcSubst"><option value="0">Manter (só preencher vazias)</option><option value="1">Substituir pelas calculadas</option></select></div>
      </div>
      <label class="chk"><input type="checkbox" id="calcAtivos" checked> Só produtos comprados nos últimos 180 dias</label>
      <div id="calcPrev" class="muted" style="font-size:13px;margin-top:8px"></div>
      <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="calcOk">Aplicar</button></div>`);
    const prever = () => {
      const dias = +el("calcDias").value || padrao, subst = el("calcSubst").value === "1", ativos = el("calcAtivos").checked;
      let n = 0, u = 0;
      state.mix.forEach((r) => {
        if (ativos && (r.dias_sem_comprar ?? 9999) > 180) return;
        if (!subst && state.pedido[r.codprod] > 0) return;
        const s = calcularSugestao(r, dias); if (s.qtd > 0) { n++; u += s.qtd; }
      });
      el("calcPrev").textContent = `Prévia: ${n} produtos, ${fmtInt.format(u)} unidades.`;
      return { dias, subst, ativos };
    };
    ["calcDias", "calcSubst", "calcAtivos"].forEach((id) => el(id).addEventListener("input", prever));
    prever();
    el("calcOk").onclick = () => {
      const { dias, subst, ativos } = prever();
      let n = 0;
      state.mix.forEach((r) => {
        if (ativos && (r.dias_sem_comprar ?? 9999) > 180) return;
        if (!subst && state.pedido[r.codprod] > 0) return;
        const s = calcularSugestao(r, dias);
        if (s.qtd > 0) { state.pedido[r.codprod] = s.qtd; n++; } else if (subst) delete state.pedido[r.codprod];
      });
      savePedido(); Mix.closeModal(); renderTable(); updatePedidoBar();
      Mix.toast(n ? `${n} produtos com quantidade sugerida (cobertura de ${dias} dias). Revise antes de enviar.` : "Nenhum produto com consumo suficiente para sugerir.", n ? "ok" : "err");
    };
  }

  function pedidoMeta() {
    const c = state.mix[0] || state.selected;
    const hoje = new Date().toLocaleDateString("pt-BR");
    return { c, hoje, nomeArq: `pedido_${c.codcli}_${(c.fantasia || c.cliente || "cliente").replace(/[^\w]+/g, "_").slice(0, 40)}_${hoje.replace(/\//g, "-")}` };
  }
  function exportPedidoExcel() {
    const rows = pedidoRows(); if (!rows.length) return;
    const { c, hoje, nomeArq } = pedidoMeta();
    const head = [
      ["SUGESTÃO DE PEDIDO"],
      ["Cliente", `${c.codcli} - ${c.cliente}`], ["Fantasia", c.fantasia || ""], ["CNPJ/CPF", c.cnpj_cpf || ""],
      ["Cidade", `${c.cidade || ""}${c.uf ? "/" + c.uf : ""}`], ["Vendedor", `${c.cod_vendedor ?? ""} - ${c.vendedor || ""}`], ["Data", hoje], [],
      ["Cód. Produto", "Produto", "Embalagem", "Última compra", "Dias s/ comprar", "Status", "Estoque", "Qtd sugerida"],
    ];
    const body = rows.map((r) => [r.codprod, r.descricao, r.embalagem || "", fmtDate(r.ultima_compra), r.dias_sem_comprar ?? "", r.status_ultima_compra || "", r.est ?? "", r.qtd]);
    body.push([], ["", "", "", "", "", "", "TOTAL", rows.reduce((s, r) => s + r.qtd, 0)]);
    const ws = XLSX.utils.aoa_to_sheet([...head, ...body]);
    ws["!cols"] = [{ wch: 12 }, { wch: 45 }, { wch: 12 }, { wch: 14 }, { wch: 15 }, { wch: 20 }, { wch: 10 }, { wch: 13 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Pedido");
    XLSX.writeFile(wb, nomeArq + ".xlsx");
  }
  function exportPedidoPdf() {
    const rows = pedidoRows(); if (!rows.length) return;
    const { c, hoje, nomeArq } = pedidoMeta();
    const total = rows.reduce((s, r) => s + r.qtd, 0);
    const jsPDF = window.jspdf?.jsPDF;
    if (!jsPDF || !jsPDF.API?.autoTable) return exportPedidoPrint(rows, c, hoje, total);
    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    if (window.MIX_LOGO) { try { doc.addImage(window.MIX_LOGO, "PNG", 168, 9, 28, 10.2); } catch {} }
    doc.setFontSize(16); doc.setTextColor(122, 31, 43); doc.text("Sugestão de pedido", 14, 16);
    doc.setFontSize(10); doc.setTextColor(40);
    const info = [
      `Cliente: ${c.codcli} - ${c.cliente}`, c.fantasia ? `Fantasia: ${c.fantasia}` : null,
      `CNPJ/CPF: ${c.cnpj_cpf || "—"}   Cidade: ${c.cidade || ""}${c.uf ? "/" + c.uf : ""}`,
      `Vendedor: ${c.cod_vendedor ?? ""} - ${c.vendedor || ""}   Data: ${hoje}`,
    ].filter(Boolean);
    info.forEach((t, i) => doc.text(t, 14, 24 + i * 5.5));
    doc.autoTable({
      startY: 24 + info.length * 5.5 + 3,
      head: [["Cód.", "Produto", "Emb.", "Última compra", "Dias s/c", "Status", "Estoque", "Qtd"]],
      body: rows.map((r) => [r.codprod, r.descricao, r.embalagem || "", fmtDate(r.ultima_compra), r.dias_sem_comprar ?? "", r.status_ultima_compra || "", r.est ?? "", r.qtd]),
      foot: [["", "", "", "", "", "", "TOTAL", total]],
      styles: { fontSize: 8.5, cellPadding: 2 },
      headStyles: { fillColor: [122, 31, 43] },
      footStyles: { fillColor: [240, 240, 240], textColor: 20, fontStyle: "bold" },
      columnStyles: { 0: { cellWidth: 14 }, 1: { cellWidth: 60 }, 2: { cellWidth: 17 }, 3: { cellWidth: 22 }, 4: { cellWidth: 15, halign: "right" }, 5: { cellWidth: 26 }, 6: { cellWidth: 16, halign: "right" }, 7: { cellWidth: 14, halign: "right", fontStyle: "bold" } },
      didDrawPage: () => {
        doc.setFontSize(8); doc.setTextColor(120);
        doc.text(`${cfg.EMPRESA || "Mix Clientes"} · gerado em ${new Date().toLocaleString("pt-BR")} · página ${doc.internal.getNumberOfPages()}`, 14, doc.internal.pageSize.getHeight() - 8);
      },
    });
    doc.save(nomeArq + ".pdf");
  }
  // Plano B: janela de impressão (Salvar como PDF) caso a biblioteca não carregue
  function exportPedidoPrint(rows, c, hoje, total) {
    const w = window.open("", "_blank");
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Sugestão de pedido</title>
      <style>body{font-family:Arial,sans-serif;padding:24px;color:#222}h1{color:#7a1f2b;font-size:20px;margin:0 0 8px}p{margin:2px 0;font-size:13px}
      table{border-collapse:collapse;width:100%;margin-top:14px;font-size:12px}th,td{border:1px solid #ccc;padding:5px 7px;text-align:left}th{background:#7a1f2b;color:#fff}td.n,th.n{text-align:right}tfoot td{font-weight:bold;background:#f2f2f2}</style></head><body>
      ${window.MIX_LOGO ? `<img src="${window.MIX_LOGO}" alt="" style="float:right;height:34px;opacity:.85">` : ""}
      <h1>Sugestão de pedido</h1>
      <p><b>Cliente:</b> ${esc(c.codcli)} - ${esc(c.cliente)}</p>${c.fantasia ? `<p><b>Fantasia:</b> ${esc(c.fantasia)}</p>` : ""}
      <p><b>CNPJ/CPF:</b> ${esc(c.cnpj_cpf || "—")} &nbsp; <b>Cidade:</b> ${esc(c.cidade || "")}${c.uf ? "/" + esc(c.uf) : ""}</p>
      <p><b>Vendedor:</b> ${esc(c.cod_vendedor ?? "")} - ${esc(c.vendedor || "")} &nbsp; <b>Data:</b> ${hoje}</p>
      <table><thead><tr><th>Cód.</th><th>Produto</th><th>Emb.</th><th>Última compra</th><th class="n">Dias s/c</th><th>Status</th><th class="n">Estoque</th><th class="n">Qtd</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td>${r.codprod}</td><td>${esc(r.descricao)}</td><td>${esc(r.embalagem || "")}</td><td>${fmtDate(r.ultima_compra)}</td><td class="n">${r.dias_sem_comprar ?? ""}</td><td>${esc(r.status_ultima_compra || "")}</td><td class="n">${r.est ?? ""}</td><td class="n"><b>${r.qtd}</b></td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="7">TOTAL</td><td class="n">${total}</td></tr></tfoot></table>
      <scr`+`ipt>window.onload=()=>window.print()</scr`+`ipt></body></html>`);
    w.document.close();
  }

  function diasDesde(iso) {
    const d = new Date(iso + "T00:00:00");
    return Math.max(0, Math.round((Date.now() - d.getTime()) / 86400000));
  }
  function ordStatus(s) {
    const order = ["COMPROU ATE 30", "31 A 60", "61 A 90", "91 A 180", "181 A 365", "1 A 2", "2 A 3", "3 A 4", "4 A 5"];
    const i = order.findIndex((o) => s.toUpperCase().startsWith(o));
    return i < 0 ? 99 : i;
  }

  // ---------------- BOOT ----------------
  const ctx = await Mix.getSessionProfile();
  if (ctx) renderApp(ctx); else renderLogin();
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") renderLogin(); });
})();
</script>
</body>
</html>
