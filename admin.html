<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Clientes — Administração</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div id="root"></div>

<script>
(async () => {
  const { sb, esc, el, showMsg, fmtInt, ROLE_LABEL, openModal, closeModal, toast } = Mix;
  const ctx = await Mix.requireAuth({ adminOnly: true });
  const root = el("root");

  root.innerHTML = Mix.renderTopbar(ctx.profile, "admin") + `
    <div class="wrap">
      <h1>Administração</h1>
      <p class="sub">Gerencie usuários, permissões e a base de dados do mix.</p>
      <div class="tabs">
        <button class="active" data-tab="users">Usuários</button>
        <button data-tab="upload">Planilha do mix</button>
        <button data-tab="rotas">Roteiros e clientes</button>
        <button data-tab="metas">Metas (vendas)</button>
        <button data-tab="integ">Integração Winthor</button>
        <button data-tab="equipe">Equipe na base</button>
        <button data-tab="uso">Uso</button>
      </div>
      <div id="tab-users"></div>
      <div id="tab-upload" hidden></div>
      <div id="tab-rotas" hidden></div>
      <div id="tab-metas" hidden></div>
      <div id="tab-integ" hidden></div>
      <div id="tab-equipe" hidden></div>
      <div id="tab-uso" hidden></div>
    </div>`;
  Mix.bindTopbar();

  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
    ["users", "upload", "rotas", "metas", "integ", "equipe", "uso"].forEach((t) => el("tab-" + t).hidden = t !== b.dataset.tab);
    if (b.dataset.tab === "integ") renderInteg();
    if (b.dataset.tab === "equipe") loadEquipe();
    if (b.dataset.tab === "uso") loadUso();
  }));

  // =====================================================================
  //  USUÁRIOS
  // =====================================================================
  let users = [];
  async function loadUsers() {
    const { data, error } = await sb.from("profiles").select("*").order("role").order("nome");
    if (error) return toast(error.message, "err");
    users = data;
    renderUsers();
  }

  function renderUsers() {
    el("tab-users").innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px">
        <h2>Novo usuário</h2>
        <form id="newUser">
          <div class="form-grid">
            <div class="field"><label>Login *</label><input type="text" id="uLogin" required placeholder="ex: eduardo"></div>
            <div class="field"><label>Nome *</label><input type="text" id="uNome" required></div>
            <div class="field"><label>Senha *</label><input type="text" id="uSenha" required placeholder="mín. 4 caracteres"></div>
            <div class="field"><label>Perfil *</label>
              <select id="uRole"><option value="vendedor">Vendedor</option><option value="supervisor">Supervisor</option><option value="admin">Administrador</option></select></div>
            <div class="field"><label>Cód. vendedor</label><input type="number" id="uVend" placeholder="da planilha"></div>
            <div class="field"><label>Cód. supervisor</label><input type="number" id="uSup" placeholder="da planilha"></div>
          </div>
          <div id="uMsg"></div>
          <button class="btn" type="submit">Criar usuário</button>
          <span class="muted" style="font-size:13px;margin-left:10px">Vendedor precisa do <b>cód. vendedor</b>; supervisor precisa do <b>cód. supervisor</b> (veja a aba "Equipe na base").</span>
        </form>
      </div>

      <div class="card card-pad">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="margin:0">Usuários cadastrados <span class="badge gray">${users.length}</span></h2>
          <input type="search" id="uFilter" placeholder="Filtrar…" style="max-width:240px">
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th class="num">Cód. vend.</th><th class="num">Cód. sup.</th><th>Ações</th></tr></thead>
          <tbody id="uBody"></tbody>
        </table></div>
      </div>`;

    el("newUser").addEventListener("submit", async (e) => {
      e.preventDefault();
      const role = el("uRole").value;
      const payload = {
        p_login: el("uLogin").value.trim().toLowerCase().replace(/\s+/g, ""),
        p_senha: el("uSenha").value, p_nome: el("uNome").value.trim(), p_role: role,
        p_cod_vendedor: el("uVend").value ? +el("uVend").value : null,
        p_cod_supervisor: el("uSup").value ? +el("uSup").value : null,
      };
      if (role === "vendedor" && payload.p_cod_vendedor == null) return showMsg(el("uMsg"), "Informe o código do vendedor.", "err");
      if (role === "supervisor" && payload.p_cod_supervisor == null) return showMsg(el("uMsg"), "Informe o código do supervisor.", "err");
      const { error } = await sb.rpc("admin_criar_usuario", payload);
      if (error) return showMsg(el("uMsg"), error.message, "err");
      toast(`Usuário ${payload.p_login} criado.`);
      e.target.reset();
      loadUsers();
    });
    el("uFilter").addEventListener("input", renderUserRows);
    renderUserRows();
  }

  function renderUserRows() {
    const f = (el("uFilter")?.value || "").toLowerCase();
    const list = users.filter((u) => !f || u.nome.toLowerCase().includes(f) || u.login.includes(f) || (ROLE_LABEL[u.role] || "").toLowerCase().includes(f));
    el("uBody").innerHTML = list.map((u) => `
      <tr>
        <td><b>${esc(u.nome)}</b></td>
        <td class="mono">${esc(u.login)}</td>
        <td><span class="badge ${u.role === "admin" ? "brand" : u.role === "supervisor" ? "warn" : "gray"}">${esc(ROLE_LABEL[u.role])}</span></td>
        <td class="num">${u.cod_vendedor ?? "—"}</td>
        <td class="num">${u.cod_supervisor ?? "—"}</td>
        <td style="white-space:nowrap">
          <button class="btn ghost sm" data-act="senha" data-id="${u.id}">Redefinir senha</button>
          <button class="btn ghost sm" data-act="edit" data-id="${u.id}">Editar</button>
          ${u.id !== ctx.profile.id ? `<button class="btn ghost sm" style="color:var(--bad)" data-act="del" data-id="${u.id}">Excluir</button>` : ""}
        </td>
      </tr>`).join("") || `<tr><td colspan="6" class="empty">Nenhum usuário</td></tr>`;
    el("uBody").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => userAction(b.dataset.act, users.find((u) => u.id === b.dataset.id))));
  }

  function userAction(act, u) {
    if (act === "senha") {
      openModal(`
        <h3>Redefinir senha — ${esc(u.nome)}</h3>
        <div class="field"><label>Nova senha</label><input type="text" id="mSenha" placeholder="mín. 4 caracteres"></div>
        <div id="mMsg"></div>
        <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="mOk">Salvar</button></div>`);
      el("mOk").onclick = async () => {
        const { error } = await sb.rpc("admin_redefinir_senha", { p_user_id: u.id, p_senha: el("mSenha").value });
        if (error) return showMsg(el("mMsg"), error.message, "err");
        closeModal(); toast(`Senha de ${u.login} redefinida.`);
      };
    }
    if (act === "edit") {
      openModal(`
        <h3>Editar — ${esc(u.login)}</h3>
        <div class="field"><label>Nome</label><input type="text" id="mNome" value="${esc(u.nome)}"></div>
        <div class="field"><label>Perfil</label><select id="mRole">
          ${["vendedor", "supervisor", "admin"].map((r) => `<option value="${r}" ${u.role === r ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}</select></div>
        <div class="form-grid">
          <div class="field"><label>Cód. vendedor</label><input type="number" id="mVend" value="${u.cod_vendedor ?? ""}"></div>
          <div class="field"><label>Cód. supervisor</label><input type="number" id="mSup" value="${u.cod_supervisor ?? ""}"></div>
        </div>
        <div id="mMsg"></div>
        <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="mOk">Salvar</button></div>`);
      el("mOk").onclick = async () => {
        const { error } = await sb.rpc("admin_editar_usuario", {
          p_user_id: u.id, p_nome: el("mNome").value.trim(), p_role: el("mRole").value,
          p_cod_vendedor: el("mVend").value ? +el("mVend").value : null,
          p_cod_supervisor: el("mSup").value ? +el("mSup").value : null,
        });
        if (error) return showMsg(el("mMsg"), error.message, "err");
        closeModal(); toast("Usuário atualizado."); loadUsers();
      };
    }
    if (act === "del") {
      openModal(`
        <h3>Excluir usuário</h3>
        <p>Tem certeza que deseja excluir <b>${esc(u.nome)}</b> (${esc(u.login)})? Esta ação não pode ser desfeita.</p>
        <div id="mMsg"></div>
        <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" id="mOk">Excluir</button></div>`);
      el("mOk").onclick = async () => {
        const { error } = await sb.rpc("admin_excluir_usuario", { p_user_id: u.id });
        if (error) return showMsg(el("mMsg"), error.message, "err");
        closeModal(); toast("Usuário excluído."); loadUsers();
      };
    }
  }

  // =====================================================================
  //  UPLOAD DA PLANILHA
  // =====================================================================
  const COLUMNS = ["codcli","cliente","fantasia","cnpj_cpf","cidade","uf","cod_vendedor","vendedor","cod_supervisor","supervisor",
    "codprod","descricao","embalagem","unidade","codfornec","fornecedor","primeira_compra_periodo","ultima_compra","dias_sem_comprar",
    "qtd_pedidos","qtd_notas","qtd_total_comprada","valor_total_comprado","preco_medio","ultimo_preco_pago","estoque_filial_1",
    "qtd_bloqueada_filial_1","qtd_reservada_filial_1","estoque_disponivel_filial_1","status_ultima_compra"];
  const INT_COLS = new Set(["codcli","cod_vendedor","cod_supervisor","codprod","codfornec","dias_sem_comprar","qtd_pedidos","qtd_notas","estoque_filial_1","qtd_bloqueada_filial_1","qtd_reservada_filial_1","estoque_disponivel_filial_1"]);
  const NUM_COLS = new Set(["qtd_total_comprada","valor_total_comprado","preco_medio","ultimo_preco_pago"]);
  const DATE_COLS = new Set(["primeira_compra_periodo","ultima_compra"]);

  let parsed = null;

  async function renderUpload() {
    const { data: meta } = await sb.from("mix_meta").select("*").eq("id", 1).maybeSingle();
    el("tab-upload").innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px">
        <h2>Base atual</h2>
        ${meta?.atualizado_em
          ? `<p class="sub" style="margin:0">Última atualização em <b>${new Date(meta.atualizado_em).toLocaleString("pt-BR")}</b> — ${fmtInt.format(meta.linhas)} linhas (${esc(meta.arquivo || "")})</p>`
          : `<p class="sub" style="margin:0">Nenhuma planilha carregada ainda.</p>`}
      </div>
      <div class="card card-pad">
        <h2>Carregar nova planilha</h2>
        <div class="msg info" style="margin:0 0 14px">
          <b>Origem da planilha:</b> gere o <b>Relatório 8235</b> no sistema e salve em <b>.csv</b>. Depois carregue o arquivo aqui — a base atual é <b>substituída</b> pela nova.
        </div>
        <p class="sub">Também aceita <b>.xlsx</b> e <b>.xls</b> com as colunas do relatório (CODCLI, CLIENTE, FANTASIA, COD_VENDEDOR, COD_SUPERVISOR, CODPROD…).<br>
        <span class="muted">Evite o .xls antigo: ele corta o relatório em 65.536 linhas. O .csv traz o relatório completo.</span></p>
        <div class="dropzone" id="drop">
          <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
          <div><b>Clique para escolher</b> ou arraste o arquivo aqui</div>
          <div style="font-size:13px;margin-top:4px">xlsx · xls · csv</div>
        </div>
        <div id="upInfo" style="margin-top:14px"></div>
        <div class="progress" id="upProg" hidden><div></div></div>
        <div id="upMsg"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="btnImport" disabled>Substituir base pela planilha</button>
          <span class="muted" id="upStatus" style="font-size:13px"></span>
        </div>
      </div>`;

    const drop = el("drop"), file = el("file");
    drop.addEventListener("click", () => file.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    file.addEventListener("change", () => file.files[0] && handleFile(file.files[0]));
    el("btnImport").addEventListener("click", importRows);
  }

  function normHeader(h) {
    return String(h || "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase();
  }

  function toInt(v) { if (v == null || v === "") return null; const n = parseInt(String(v).replace(/\./g, "").replace(",", "."), 10); return isNaN(n) ? null : n; }
  function toNum(v) {
    if (v == null || v === "") return null;
    if (typeof v === "number") return v;
    let s = String(v).trim();
    if (/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); // 1.234,56
    else s = s.replace(",", ".");
    const n = parseFloat(s); return isNaN(n) ? null : n;
  }
  function toDate(v) {
    if (v == null || v === "") return null;
    if (v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}-${String(v.getDate()).padStart(2, "0")}`;
    if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}` : null; }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    return null;
  }

  // --- Leitura de CSV própria (aceita ; ou , / com ou sem cabeçalho / latin1 ou utf-8)
  function decodeText(buf) {
    try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
    catch { return new TextDecoder("windows-1252").decode(buf); }
  }
  function parseCsv(text) {
    const firstLine = text.slice(0, text.indexOf("\n") > 0 ? text.indexOf("\n") : text.length);
    const delim = (firstLine.split(";").length >= firstLine.split(",").length) ? ";" : (firstLine.split("\t").length > firstLine.split(",").length ? "\t" : ",");
    const rows = []; let row = [], field = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQ) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === delim) { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += ch;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function readRaw(f, buf) {
    if (/\.(csv|txt)$/i.test(f.name)) return parseCsv(decodeText(buf));
    const wb = XLSX.read(buf, { type: "array", cellDates: true, raw: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  }

  function handleFile(f) {
    parsed = null; el("btnImport").disabled = true;
    showMsg(el("upMsg"), ""); el("upInfo").innerHTML = `<span class="spinner dark"></span> Lendo ${esc(f.name)}…`;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const raw = readRaw(f, e.target.result);
        if (raw.length < 1) throw new Error("Planilha vazia.");
        // Cabeçalho presente? (primeira célula não numérica e alguma coluna reconhecida)
        const firstHeaders = (raw[0] || []).map(normHeader);
        const hasHeader = firstHeaders.some((h) => COLUMNS.includes(h)) && isNaN(parseInt(String(raw[0][0]), 10));
        const idx = {};
        let semCabecalho = false;
        if (hasHeader) {
          firstHeaders.forEach((h, i) => { if (COLUMNS.includes(h) && idx[h] == null) idx[h] = i; });
        } else {
          // Sem cabeçalho: assume a ordem padrão do relatório (30 colunas)
          const ncols = (raw[0] || []).length;
          if (ncols < 30) throw new Error(`Arquivo sem cabeçalho com ${ncols} colunas — esperado 30 colunas na ordem padrão do relatório, ou uma linha de cabeçalho.`);
          COLUMNS.forEach((c, i) => idx[c] = i);
          semCabecalho = true;
        }
        const missing = ["codcli", "cliente", "cod_vendedor", "cod_supervisor", "codprod", "descricao"].filter((c) => idx[c] == null);
        if (missing.length) throw new Error("Colunas obrigatórias não encontradas: " + missing.join(", ").toUpperCase());
        const found = Object.keys(idx);
        const rows = [];
        for (let i = hasHeader ? 1 : 0; i < raw.length; i++) {
          const r = raw[i]; if (!r || r[idx.codcli] == null || r[idx.codcli] === "") continue;
          const o = {};
          for (const c of found) {
            let v = r[idx[c]];
            if (INT_COLS.has(c)) v = toInt(v);
            else if (NUM_COLS.has(c)) v = toNum(v);
            else if (DATE_COLS.has(c)) v = toDate(v);
            else v = v == null ? null : String(v).trim();
            o[c] = v;
          }
          if (o.codcli == null || o.codprod == null) continue;
          rows.push(o);
        }
        if (!rows.length) throw new Error("Nenhuma linha válida encontrada.");
        const clientes = new Set(rows.map((r) => r.codcli)).size;
        const vend = new Set(rows.map((r) => r.cod_vendedor)).size;
        const sup = new Set(rows.map((r) => r.cod_supervisor)).size;
        parsed = { rows, name: f.name };
        const ex = rows[0];
        el("upInfo").innerHTML = `
          <div class="kpis" style="margin:0">
            <div class="kpi"><div class="l">Linhas</div><div class="v">${fmtInt.format(rows.length)}</div></div>
            <div class="kpi"><div class="l">Clientes</div><div class="v">${fmtInt.format(clientes)}</div></div>
            <div class="kpi"><div class="l">Vendedores</div><div class="v">${vend}</div></div>
            <div class="kpi"><div class="l">Supervisores</div><div class="v">${sup}</div></div>
          </div>
          <div class="muted" style="font-size:13px;margin-top:8px">
            ${semCabecalho ? "Arquivo sem cabeçalho — usada a ordem padrão das 30 colunas. " : ""}Colunas reconhecidas: ${found.length}/${COLUMNS.length}${found.length < COLUMNS.length ? " (faltando: " + COLUMNS.filter((c) => !found.includes(c)).join(", ") + ")" : ""}<br>
            Conferência da 1ª linha: <b>${esc(ex.cliente)}</b> · vendedor ${esc(ex.vendedor || "")} (${ex.cod_vendedor}) · produto ${esc(ex.descricao)} · última compra ${ex.ultima_compra || "—"} · valor ${ex.valor_total_comprado ?? "—"}
          </div>
          ${rows.length === 65535 ? `<div class="msg err">Atenção: exatamente 65.535 linhas — o Excel provavelmente cortou o relatório (limite do .xls). Exporte como .xlsx ou .csv.</div>` : ""}`;
        el("btnImport").disabled = false;
      } catch (err) {
        el("upInfo").innerHTML = ""; showMsg(el("upMsg"), err.message, "err");
      }
    };
    reader.readAsArrayBuffer(f);
  }

  async function importRows() {
    if (!parsed) return;
    const btn = el("btnImport"); btn.disabled = true;
    const prog = el("upProg"), bar = prog.firstElementChild, st = el("upStatus");
    prog.hidden = false; bar.style.width = "0%"; showMsg(el("upMsg"), "");
    try {
      st.textContent = "Limpando base atual…";
      let { error } = await sb.rpc("admin_limpar_mix"); if (error) throw error;
      const rows = parsed.rows, BATCH = 1000;
      for (let i = 0; i < rows.length; i += BATCH) {
        const chunk = rows.slice(i, i + BATCH);
        let tries = 0;
        while (true) {
          const { error } = await sb.from("mix").insert(chunk);
          if (!error) break;
          if (++tries >= 3) throw error;
          await new Promise((r) => setTimeout(r, 1200));
        }
        const done = Math.min(i + BATCH, rows.length);
        bar.style.width = Math.round((done / rows.length) * 100) + "%";
        st.textContent = `Enviando ${fmtInt.format(done)} / ${fmtInt.format(rows.length)} linhas…`;
      }
      ({ error } = await sb.rpc("admin_registrar_upload", { p_linhas: rows.length, p_arquivo: parsed.name })); if (error) throw error;
      st.textContent = ""; showMsg(el("upMsg"), `Base atualizada com ${fmtInt.format(rows.length)} linhas.`, "ok");
      toast("Planilha importada com sucesso.");
      parsed = null;
      setTimeout(renderUpload, 1500);
    } catch (err) {
      st.textContent = ""; showMsg(el("upMsg"), "Erro: " + err.message + " — a base pode estar incompleta; envie a planilha novamente.", "err");
      btn.disabled = false;
    }
  }

  // =====================================================================
  //  MAPA DO FORMATO DA ROTINA 8236 (promotores x dia de visita) — usado pelo upload único
  // =====================================================================
  // Cabeçalho do relatório -> coluna da tabela "roteiro"
  const RT_MAP = {
    cod_supervisor: "cod_supervisor", supervisor: "supervisor", cod_sup_promotor: "cod_sup_promotor", supervisor_promotor: "supervisor_promotor",
    cod_rca: "cod_vendedor", rca: "vendedor", cod_vendedor: "cod_vendedor", vendedor: "vendedor",
    cod_promotor: "cod_promotor", promotor: "promotor", codcli: "codcli", cliente: "cliente", fantasia: "fantasia", cnpj_cpf: "cnpj_cpf",
    endereco: "endereco", numero: "numero", bairro: "bairro", cidade: "cidade", uf: "uf",
    data_ultima_compra: "ultima_compra", ultima_compra: "ultima_compra", dias_sem_compra: "dias_sem_comprar", dias_sem_comprar: "dias_sem_comprar",
    dia_semana_cadastrado: "dia_semana_cadastrado", dia_semana: "dia_semana", data_proxima_visita: "proxima_visita", proxima_visita: "proxima_visita",
    dia_calculado_data: "dia_calculado", horario_visita: "horario_visita", sequencia_visita: "sequencia_visita", periodicidade: "periodicidade",
    numero_semana: "numero_semana", ciclo_visita: "ciclo_visita", dia_fixo: "dia_fixo", data_inicio_rota: "data_inicio_rota", data_final_rota: "data_final_rota",
    ultima_visita_prevista: "ultima_visita_prevista", data_referencia: "data_referencia", zona: "zona", observacao: "observacao", qtd_clientes_promotor: "qtd_clientes_promotor",
  };
  // Ordem padrão do relatório quando vier sem cabeçalho (39 colunas + coluna vazia final)
  const RT_ORDER = ["cod_supervisor","supervisor","cod_sup_promotor","supervisor_promotor","cod_rca","rca","cod_promotor","promotor","codcli","cliente","fantasia","cnpj_cpf",
    "endereco","numero","bairro","cidade","uf","data_ultima_compra","dias_sem_compra","dia_semana_cadastrado","dia_semana","data_proxima_visita","data_visita_formatada",
    "dia_calculado_data","hora_visita","minuto_visita","horario_visita","sequencia_visita","periodicidade","numero_semana","ciclo_visita","dia_fixo","data_inicio_rota",
    "data_final_rota","ultima_visita_prevista","data_referencia","zona","observacao","qtd_clientes_promotor"];
  const RT_INT = new Set(["cod_supervisor","cod_sup_promotor","cod_vendedor","cod_promotor","codcli","dias_sem_comprar","sequencia_visita","periodicidade","numero_semana","qtd_clientes_promotor"]);
  const RT_DATE = new Set(["ultima_compra","proxima_visita","data_inicio_rota","data_final_rota","ultima_visita_prevista","data_referencia"]);

  function parseRoteiroRows(raw) {
    const first = (raw[0] || []).map(normHeader);
    const hasHeader = first.some((h) => RT_MAP[h]) && isNaN(parseInt(String(raw[0][0]), 10));
    const idx = {}; // coluna da tabela -> índice no arquivo
    if (hasHeader) first.forEach((h, i) => { const c = RT_MAP[h]; if (c && idx[c] == null) idx[c] = i; });
    else {
      const ncols = (raw[0] || []).length;
      if (ncols < RT_ORDER.length) throw new Error(`Arquivo sem cabeçalho com ${ncols} colunas — esperado ${RT_ORDER.length} na ordem padrão do relatório, ou uma linha de cabeçalho.`);
      RT_ORDER.forEach((h, i) => { const c = RT_MAP[h]; if (c && idx[c] == null) idx[c] = i; });
    }
    const missing = ["codcli", "cod_vendedor", "cod_promotor"].filter((c) => idx[c] == null);
    if (missing.length) throw new Error("Colunas obrigatórias não encontradas: " + missing.join(", ").toUpperCase());
    const found = Object.keys(idx), rows = [];
    for (let i = hasHeader ? 1 : 0; i < raw.length; i++) {
      const r = raw[i]; if (!r || r[idx.codcli] == null || r[idx.codcli] === "") continue;
      const o = {};
      for (const c of found) {
        let v = r[idx[c]];
        if (RT_INT.has(c)) v = toInt(v);
        else if (RT_DATE.has(c)) v = toDate(v);
        else { v = v == null ? null : String(v).trim(); if (v === "") v = null; }
        o[c] = v;
      }
      if (o.codcli == null) continue;
      rows.push(o);
    }
    return { rows, found, semCabecalho: !hasHeader };
  }

  // =====================================================================
  //  UPLOAD ÚNICO: ROTEIROS (promotor + vendedor) E BASE DE CLIENTES
  //  Relatório "clientes x dia de visita do RCA" com TODOS os RCAs, inclusive os promotores
  //  (linhas cujo supervisor é PROMOTORES / RCA começa com PROMOTOR).
  //  - Linhas de vendedor  -> roteiro_vendedor (as que têm DATA_PROXIMA_VISITA) + base de clientes
  //  - Linhas de promotor  -> roteiro (promotor); vendedor/supervisor do cliente vêm da linha do vendedor
  //  Também aceita o formato da rotina 8236 (com COD_PROMOTOR): nesse caso só o roteiro do promotor é substituído.
  // =====================================================================
  const RV_MAP = {
    cod_supervisor: "cod_supervisor", supervisor: "supervisor", cod_rca: "cod_vendedor", rca: "vendedor", cod_vendedor: "cod_vendedor", vendedor: "vendedor",
    codcli: "codcli", cliente: "cliente", fantasia: "fantasia", cnpj_cpf: "cnpj_cpf", endereco: "endereco", numero: "numero", bairro: "bairro", cidade: "cidade", uf: "uf", telefone: "telefone",
    dia_semana_cadastrado: "dia_semana_cadastrado", dia_semana: "dia_semana", data_proxima_visita: "proxima_visita", proxima_visita: "proxima_visita",
    sequencia_visita: "sequencia_visita", horario_visita: "horario_visita", periodicidade: "periodicidade", numero_semana: "numero_semana", ciclo_visita: "ciclo_visita", dia_fixo: "dia_fixo",
    data_inicio_rota: "data_inicio_rota", data_final_rota: "data_final_rota", ultima_visita_prevista: "ultima_visita_prevista", data_referencia: "data_referencia", zona: "zona", observacao: "observacao",
    status_rota: "status_rota", data_ultima_compra: "ultima_compra", ultima_compra: "ultima_compra", dias_sem_compra: "dias_sem_comprar", dias_sem_comprar: "dias_sem_comprar",
    status_ultima_compra: "status_ultima_compra", qtd_clientes_rca: "qtd_clientes_rca", qtd_clientes_supervisor: "qtd_clientes_supervisor",
  };
  const RV_INT = new Set(["cod_supervisor","cod_vendedor","codcli","sequencia_visita","periodicidade","numero_semana","dias_sem_comprar","qtd_clientes_rca","qtd_clientes_supervisor"]);
  const RV_DATE = new Set(["proxima_visita","data_inicio_rota","data_final_rota","ultima_visita_prevista","data_referencia","ultima_compra"]);
  const RV_ROTA_COLS = ["cod_supervisor","supervisor","cod_vendedor","vendedor","codcli","cliente","fantasia","cnpj_cpf","endereco","numero","bairro","cidade","uf","telefone",
    "dia_semana_cadastrado","dia_semana","proxima_visita","sequencia_visita","horario_visita","periodicidade","numero_semana","ciclo_visita","dia_fixo","data_inicio_rota","data_final_rota",
    "ultima_visita_prevista","data_referencia","zona","observacao","status_rota","ultima_compra","dias_sem_comprar","status_ultima_compra"];
  const RV_CLI_COLS = ["cod_supervisor","supervisor","cod_vendedor","vendedor","codcli","cliente","fantasia","cnpj_cpf","endereco","numero","bairro","cidade","uf","telefone",
    "ultima_compra","dias_sem_comprar","status_ultima_compra","qtd_clientes_rca","qtd_clientes_supervisor"];
  // Colunas da tabela "roteiro" (promotor) preenchidas a partir de uma linha de promotor do arquivo único
  const RT_FROM_RV = ["codcli","cliente","fantasia","cnpj_cpf","endereco","numero","bairro","cidade","uf","ultima_compra","dias_sem_comprar",
    "dia_semana_cadastrado","dia_semana","proxima_visita","horario_visita","sequencia_visita","periodicidade","numero_semana","ciclo_visita","dia_fixo",
    "data_inicio_rota","data_final_rota","ultima_visita_prevista","data_referencia","zona","observacao"];

  // Linha de promotor: supervisor "PROMOTORES" (ou nome do RCA começando com PROMOTOR/PROMOTRA)
  function ehPromotor(o) {
    const sup = normHeader(o.supervisor || ""), rca = normHeader(o.vendedor || "");
    return sup.includes("promotor") || rca.startsWith("promot");
  }

  let parsedRv = null;

  function metaLine(meta, rotulo, unidade) {
    return meta?.atualizado_em
      ? `<div><b>${rotulo}:</b> ${new Date(meta.atualizado_em).toLocaleString("pt-BR")} — ${fmtInt.format(meta.linhas)} ${unidade} <span class="muted">(${esc(meta.arquivo || "")})</span></div>`
      : `<div><b>${rotulo}:</b> <span class="muted">nada carregado ainda</span></div>`;
  }

  async function renderRotas() {

    el("tab-rotas").innerHTML = `

  function parseRvRows(raw) {
    const first = (raw[0] || []).map(normHeader);
    const hasHeader = first.some((h) => RV_MAP[h]) && isNaN(parseInt(String(raw[0][0]), 10));
    if (!hasHeader) throw new Error("A planilha precisa vir com a linha de cabeçalho (COD_SUPERVISOR; SUPERVISOR; COD_RCA; RCA; CODCLI; …).");
    const idx = {};
    first.forEach((h, i) => { const c = RV_MAP[h]; if (c && idx[c] == null) idx[c] = i; });
    const missing = ["codcli", "cliente", "cod_vendedor", "cod_supervisor", "proxima_visita"].filter((c) => idx[c] == null);
    if (missing.length) throw new Error("Colunas obrigatórias não encontradas: " + missing.join(", ").toUpperCase());
    const found = Object.keys(idx), linhas = [];
    for (let i = 1; i < raw.length; i++) {
      const r = raw[i]; if (!r || r[idx.codcli] == null || r[idx.codcli] === "") continue;
      const o = {};
      for (const c of found) {
        let v = r[idx[c]];
        if (RV_INT.has(c)) v = toInt(v);
        else if (RV_DATE.has(c)) v = toDate(v);
        else { v = v == null ? null : String(v).trim(); if (v === "") v = null; }
        o[c] = v;
      }
      if (o.codcli != null) linhas.push(o);
    }
    // separa vendedores x promotores
    const vendRows = linhas.filter((o) => !ehPromotor(o)), promRows = linhas.filter(ehPromotor);
    const rotas = [], clientes = [], seen = new Set(), cliMap = new Map();
    for (const o of vendRows) {
      if (o.proxima_visita) { const rt = {}; RV_ROTA_COLS.forEach((c) => { if (c in o) rt[c] = o[c]; }); rotas.push(rt); }
      if (!seen.has(o.codcli)) { seen.add(o.codcli); const cl = {}; RV_CLI_COLS.forEach((c) => { if (c in o) cl[c] = o[c]; }); clientes.push(cl); cliMap.set(o.codcli, cl); }
    }
    // roteiro do promotor: vendedor/supervisor do cliente vêm da linha do vendedor
    const qtdProm = new Map();
    promRows.forEach((o) => qtdProm.set(o.cod_vendedor, (qtdProm.get(o.cod_vendedor) || 0) + 1));
    const promotor = [];
    let promSemVend = 0;
    for (const o of promRows) {
      if (!o.proxima_visita) continue;
      const cl = cliMap.get(o.codcli);
      if (!cl) promSemVend++;
      const rt = { cod_promotor: o.cod_vendedor, promotor: o.vendedor, cod_sup_promotor: o.cod_supervisor, supervisor_promotor: o.supervisor,
        cod_vendedor: cl?.cod_vendedor ?? null, vendedor: cl?.vendedor ?? null, cod_supervisor: cl?.cod_supervisor ?? null, supervisor: cl?.supervisor ?? null,
        qtd_clientes_promotor: qtdProm.get(o.cod_vendedor) || null };
      RT_FROM_RV.forEach((c) => { if (c in o) rt[c] = o[c]; });
      promotor.push(rt);
    }
    return { rotas, clientes, promotor, promSemVend, found };
  }

  function handleRvFile(f) {
    parsedRv = null; el("rvImport").disabled = true;
    showMsg(el("rvMsg"), ""); el("rvInfo").innerHTML = `<span class="spinner dark"></span> Lendo ${esc(f.name)}…`;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const raw = readRaw(f, e.target.result);
        if (raw.length < 2) throw new Error("Planilha vazia.");
        const header = (raw[0] || []).map(normHeader);
        if (header.includes("cod_promotor")) {
          // Formato da rotina 8236: só o roteiro do promotor
          const { rows, found } = parseRoteiroRows(raw);
          if (!rows.length) throw new Error("Nenhuma linha válida encontrada.");
          parsedRv = { modo: "8236", promotor: rows, name: f.name };
          const ex = rows.find((r) => r.proxima_visita) || rows[0];
          el("rvInfo").innerHTML = `
            <div class="msg warn" style="margin:0 0 10px">Arquivo no formato da <b>rotina 8236</b> (com COD_PROMOTOR): será atualizado <b>apenas o roteiro do promotor</b>. Roteiro do vendedor e base de clientes ficam como estão.</div>
            <div class="kpis" style="margin:0">
              <div class="kpi"><div class="l">Linhas</div><div class="v">${fmtInt.format(rows.length)}</div><div class="s">${fmtInt.format(rows.filter((r) => r.proxima_visita).length)} com próxima visita</div></div>
              <div class="kpi"><div class="l">Lojas</div><div class="v">${fmtInt.format(new Set(rows.map((r) => r.codcli)).size)}</div></div>
              <div class="kpi"><div class="l">Promotores</div><div class="v">${new Set(rows.map((r) => r.cod_promotor)).size}</div></div>
            </div>
            <div class="muted" style="font-size:13px;margin-top:8px">Colunas reconhecidas: ${found.length}<br>Conferência: <b>${esc(ex.fantasia || ex.cliente)}</b> · promotor ${esc(ex.promotor || "")} (${ex.cod_promotor}) · vendedor ${esc(ex.vendedor || "")} (${ex.cod_vendedor}) · próxima visita ${ex.proxima_visita || "—"}</div>`;
          el("rvImport").disabled = false;
          return;
        }
        const { rotas, clientes, promotor, promSemVend, found } = parseRvRows(raw);
        if (!clientes.length) throw new Error("Nenhuma linha válida encontrada.");
        parsedRv = { modo: "unico", rotas, clientes, promotor, name: f.name };
        const vend = new Set(clientes.map((r) => r.cod_vendedor)).size, comRota = new Set(rotas.map((r) => r.codcli)).size;
        const proms = new Set(promotor.map((r) => r.cod_promotor)).size, lojasProm = new Set(promotor.map((r) => r.codcli)).size;
        const ex = rotas[0] || clientes[0], exp = promotor[0];
        el("rvInfo").innerHTML = `
          <div class="kpis" style="margin:0">
            <div class="kpi"><div class="l">Clientes</div><div class="v">${fmtInt.format(clientes.length)}</div><div class="s">${vend} vendedores</div></div>
            <div class="kpi"><div class="l">Roteiro vendedor</div><div class="v">${fmtInt.format(comRota)}</div><div class="s">lojas com rota · ${fmtInt.format(rotas.length)} visitas</div></div>
            <div class="kpi"><div class="l">Roteiro promotor</div><div class="v">${fmtInt.format(lojasProm)}</div><div class="s">lojas · ${proms} promotores · ${fmtInt.format(promotor.length)} visitas</div></div>
          </div>
          <div class="muted" style="font-size:13px;margin-top:8px">Colunas reconhecidas: ${found.length}<br>
            Vendedor: <b>${esc(ex.fantasia || ex.cliente)}</b> · ${esc(ex.vendedor || "")} (${ex.cod_vendedor}) · ${ex.dia_semana ? esc(ex.dia_semana) + " · próxima visita " + (ex.proxima_visita || "—") + " · a cada " + (ex.periodicidade ?? "—") + " dias" : "sem rota"}
            ${exp ? `<br>Promotor: <b>${esc(exp.fantasia || exp.cliente)}</b> · ${esc(exp.promotor || "")} (${exp.cod_promotor}) · vendedor ${esc(exp.vendedor || "—")} · ${esc(exp.dia_semana || "")} · próxima visita ${exp.proxima_visita || "—"} · a cada ${exp.periodicidade ?? "—"} dias` : ""}</div>
          ${!promotor.length ? `<div class="msg warn" style="margin-top:10px">Nenhuma linha de promotor encontrada (supervisor PROMOTORES). O <b>roteiro do promotor atual será mantido</b>; se quiser atualizá-lo, gere o relatório incluindo os promotores.</div>` : ""}
          ${promSemVend ? `<div class="msg warn" style="margin-top:10px">${fmtInt.format(promSemVend)} visitas de promotor em lojas que não têm vendedor no arquivo — ficam visíveis só para o admin.</div>` : ""}`;
        el("rvImport").disabled = false;
      } catch (err) {
        el("rvInfo").innerHTML = ""; showMsg(el("rvMsg"), err.message, "err");
      }
    };
    reader.readAsArrayBuffer(f);
  }

  async function enviarLotes(tabela, rows, bar, st, rotulo, BATCH = 500) {
    for (let i = 0; i < rows.length; i += BATCH) {
      const chunk = rows.slice(i, i + BATCH);
      let tries = 0;
      while (true) {
        const { error } = await sb.from(tabela).insert(chunk);
        if (!error) break;
        if (++tries >= 3) throw error;
        await new Promise((r) => setTimeout(r, 1200));
      }
      const done = Math.min(i + BATCH, rows.length);
      bar.style.width = Math.round((done / rows.length) * 100) + "%";
      st.textContent = `Enviando ${rotulo}: ${fmtInt.format(done)} / ${fmtInt.format(rows.length)}…`;
    }
  }

  async function importRv() {
    if (!parsedRv) return;
    const btn = el("rvImport"); btn.disabled = true;
    const prog = el("rvProg"), bar = prog.firstElementChild, st = el("rvStatus");
    prog.hidden = false; bar.style.width = "0%"; showMsg(el("rvMsg"), "");
    const p = parsedRv, partes = [];
    try {
      let error;
      if (p.modo === "8236" || p.promotor.length) {
        st.textContent = "Limpando roteiro do promotor…";
        ({ error } = await sb.rpc("admin_limpar_roteiro")); if (error) throw error;
        await enviarLotes("roteiro", p.promotor, bar, st, "roteiro promotor");
        ({ error } = await sb.rpc("admin_registrar_upload_roteiro", { p_linhas: p.promotor.length, p_arquivo: p.name })); if (error) throw error;
        partes.push(`roteiro promotor (${fmtInt.format(p.promotor.length)} visitas)`);
      }
      if (p.modo === "unico") {
        st.textContent = "Limpando roteiro do vendedor…";
        ({ error } = await sb.rpc("admin_limpar_roteiro_vendedor")); if (error) throw error;
        await enviarLotes("roteiro_vendedor", p.rotas, bar, st, "roteiro vendedor");
        ({ error } = await sb.rpc("admin_registrar_upload_roteiro_vendedor", { p_linhas: p.rotas.length, p_arquivo: p.name })); if (error) throw error;
        partes.push(`roteiro vendedor (${fmtInt.format(p.rotas.length)} visitas)`);
        st.textContent = "Limpando base de clientes…";
        ({ error } = await sb.rpc("admin_limpar_clientes")); if (error) throw error;
        await enviarLotes("clientes", p.clientes, bar, st, "clientes");
        ({ error } = await sb.rpc("admin_registrar_upload_clientes", { p_linhas: p.clientes.length, p_arquivo: p.name })); if (error) throw error;
        partes.push(`base de clientes (${fmtInt.format(p.clientes.length)})`);
      }
      st.textContent = ""; showMsg(el("rvMsg"), "Atualizado: " + partes.join(" · ") + ".", "ok");
      toast("Planilha importada.");
      parsedRv = null;
      setTimeout(renderRotas, 1500);
    } catch (err) {
      st.textContent = ""; showMsg(el("rvMsg"), "Erro: " + err.message + " — envie a planilha novamente.", "err");
      btn.disabled = false;
    }
  }


  // =====================================================================
  //  METAS: VENDA DO ANO PASSADO (Relatório 8238) E VENDA DO MÊS ATUAL (Relatório 8239)
  //  Ambos viram linhas da tabela "vendas" (uma linha por cliente x produto x mês).
  //  - 8238: colunas QTD_LIQ_<MES>_<ANO> / VLR_LIQ_<MES>_<ANO> para cada mês -> origem 'hist'
  //  - 8239: MES_REFERENCIA + QTD_LIQUIDA / VALOR_VENDA_LIQUIDA               -> origem 'atual'
  // =====================================================================
  const VD_MAP = { cod_supervisor: "cod_supervisor", supervisor: "supervisor", cod_vendedor: "cod_vendedor", vendedor: "vendedor", cod_rca: "cod_vendedor", rca: "vendedor",
    codcli: "codcli", cliente: "cliente", fantasia: "fantasia", cnpj_cpf: "cnpj_cpf", cidade: "cidade", uf: "uf",
    codprod: "codprod", descricao: "descricao", embalagem: "embalagem", unidade: "unidade", codfornec: "codfornec", fornecedor: "fornecedor" };
  const VD_INT = new Set(["cod_supervisor", "cod_vendedor", "codcli", "codprod", "codfornec"]);
  const MESES_ABREV = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
  const mesIso = (y, m) => `${y}-${String(m).padStart(2, "0")}-01`;
  const mesBR = (iso) => { const [y, m] = iso.split("-"); return `${m}/${y}`; };

  function parseVendasRows(raw, origem) {
    const first = (raw[0] || []).map(normHeader);
    const hasHeader = first.includes("codcli") && first.includes("codprod") && isNaN(parseInt(String(raw[0][0]), 10));
    if (!hasHeader) throw new Error("A planilha precisa vir com a linha de cabeçalho (COD_SUPERVISOR; SUPERVISOR; COD_VENDEDOR; VENDEDOR; CODCLI; …; CODPROD; …).");
    const idx = {};
    first.forEach((h, i) => { const c = VD_MAP[h]; if (c && idx[c] == null) idx[c] = i; });
    const missing = ["codcli", "cliente", "cod_vendedor", "cod_supervisor", "codprod", "descricao"].filter((c) => idx[c] == null);
    if (missing.length) throw new Error("Colunas obrigatórias não encontradas: " + missing.join(", ").toUpperCase());
    // Colunas de mês
    let meses = []; // { mes: 'YYYY-MM-01', iq, iv }
    let iMesRef = -1, iQtd = -1, iVal = -1;
    if (origem === "hist") {
      first.forEach((h, i) => {
        const m = h.match(/^(qtd|vlr)_liq_([a-z]{3})_(\d{4})$/);
        if (!m || !MESES_ABREV[m[2]]) return;
        const mes = mesIso(m[3], MESES_ABREV[m[2]]);
        let e = meses.find((x) => x.mes === mes); if (!e) { e = { mes, iq: -1, iv: -1 }; meses.push(e); }
        if (m[1] === "qtd") e.iq = i; else e.iv = i;
      });
      meses = meses.filter((e) => e.iq >= 0 && e.iv >= 0).sort((a, b) => a.mes.localeCompare(b.mes));
      if (!meses.length) throw new Error("Não encontrei as colunas de mês (QTD_LIQ_SET_2025, VLR_LIQ_SET_2025, …). Confira se é o Relatório 8238.");
    } else {
      iMesRef = first.indexOf("mes_referencia"); iQtd = first.indexOf("qtd_liquida"); iVal = first.indexOf("valor_venda_liquida");
      if (iQtd < 0) iQtd = first.indexOf("qtd_liq"); if (iVal < 0) iVal = first.indexOf("vlr_liq");
      if (iMesRef < 0 || iQtd < 0 || iVal < 0) throw new Error("Não encontrei as colunas MES_REFERENCIA, QTD_LIQUIDA e VALOR_VENDA_LIQUIDA. Confira se é o Relatório 8239.");
    }
    const found = Object.keys(idx), rows = [], mesesSet = new Set();
    for (let i = 1; i < raw.length; i++) {
      const r = raw[i]; if (!r || r[idx.codcli] == null || r[idx.codcli] === "") continue;
      const o = { origem };
      for (const c of found) {
        let v = r[idx[c]];
        if (VD_INT.has(c)) v = toInt(v); else { v = v == null ? null : String(v).trim(); if (v === "") v = null; }
        o[c] = v;
      }
      if (o.codcli == null || o.codprod == null) continue;
      if (origem === "hist") {
        for (const e of meses) {
          const qtd = toNum(r[e.iq]) || 0, valor = toNum(r[e.iv]) || 0;
          if (!qtd && !valor) continue; // só guarda meses com movimento
          rows.push({ ...o, mes: e.mes, qtd, valor }); mesesSet.add(e.mes);
        }
      } else {
        const ref = String(r[iMesRef] || "").trim(); let m = ref.match(/^(\d{2})\/(\d{4})$/), mes = null;
        if (m) mes = mesIso(m[2], +m[1]); else { const d = toDate(ref); if (d) mes = d.slice(0, 8) + "01"; }
        if (!mes) continue;
        rows.push({ ...o, mes, qtd: toNum(r[iQtd]) || 0, valor: toNum(r[iVal]) || 0 }); mesesSet.add(mes);
      }
    }
    return { rows, found, meses: [...mesesSet].sort() };
  }

  function handleVdFile(origem, f) {
    parsedVd[origem] = null; el("vdImport_" + origem).disabled = true;
    showMsg(el("vdMsg_" + origem), ""); el("vdInfo_" + origem).innerHTML = `<span class="spinner dark"></span> Lendo ${esc(f.name)}…`;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const raw = readRaw(f, e.target.result);
        if (raw.length < 2) throw new Error("Planilha vazia.");
        const header = (raw[0] || []).map(normHeader);
        // Avisa se o arquivo parece ser do outro relatório
        const pareceHist = header.some((h) => /^vlr_liq_[a-z]{3}_\d{4}$/.test(h)), pareceAtual = header.includes("mes_referencia");
        if (origem === "hist" && !pareceHist && pareceAtual) throw new Error("Este arquivo parece ser o Relatório 8239 (mês atual). Carregue-o no bloco 2.");
        if (origem === "atual" && !pareceAtual && pareceHist) throw new Error("Este arquivo parece ser o Relatório 8238 (ano passado). Carregue-o no bloco 1.");
        const { rows, found, meses } = parseVendasRows(raw, origem);
        if (!rows.length) throw new Error("Nenhuma linha com venda encontrada.");
        parsedVd[origem] = { rows, name: f.name, meses };
        const clientes = new Set(rows.map((r) => r.codcli)).size, vend = new Set(rows.map((r) => r.cod_vendedor)).size;
        const valor = rows.reduce((s, r) => s + r.valor, 0);
        const porMes = meses.map((m) => { const rr = rows.filter((r) => r.mes === m); return `${mesBR(m)}: ${new Set(rr.map((r) => r.codcli)).size} clientes · ${Mix.fmtBRL.format(rr.reduce((s, r) => s + r.valor, 0))}`; });
        const ex = rows[0];
        el("vdInfo_" + origem).innerHTML = `
          <div class="kpis" style="margin:0">
            <div class="kpi"><div class="l">Linhas com venda</div><div class="v">${fmtInt.format(rows.length)}</div><div class="s">${meses.length} ${meses.length === 1 ? "mês" : "meses"}</div></div>
            <div class="kpi"><div class="l">Clientes</div><div class="v">${fmtInt.format(clientes)}</div><div class="s">${vend} vendedores</div></div>
            <div class="kpi"><div class="l">Valor líquido</div><div class="v">${Mix.fmtBRL.format(valor)}</div></div>
          </div>
          <div class="muted" style="font-size:13px;margin-top:8px">${porMes.join("<br>")}<br>Colunas reconhecidas: ${found.length}. Conferência: <b>${esc(ex.cliente)}</b> · vendedor ${esc(ex.vendedor || "")} (${ex.cod_vendedor}) · ${esc(ex.descricao)} · ${mesBR(ex.mes)} · ${ex.qtd} unid. · ${Mix.fmtBRL.format(ex.valor)}</div>
          ${origem === "atual" && meses.length > 1 ? `<div class="msg warn" style="margin-top:10px">O arquivo tem mais de um mês — o "mês atual" será o mais recente (${mesBR(meses[meses.length - 1])}).</div>` : ""}`;
        el("vdImport_" + origem).disabled = false;
      } catch (err) {
        el("vdInfo_" + origem).innerHTML = ""; showMsg(el("vdMsg_" + origem), err.message, "err");
      }
    };
    reader.readAsArrayBuffer(f);
  }

  async function importVd(origem) {
    const p = parsedVd[origem]; if (!p) return;
    const btn = el("vdImport_" + origem); btn.disabled = true;
    const prog = el("vdProg_" + origem), bar = prog.firstElementChild, st = el("vdStatus_" + origem);
    prog.hidden = false; bar.style.width = "0%"; showMsg(el("vdMsg_" + origem), "");
    try {
      st.textContent = "Limpando base atual…";
      let { error } = await sb.rpc("admin_limpar_vendas", { p_origem: origem }); if (error) throw error;
      await enviarLotes("vendas", p.rows, bar, st, origem === "hist" ? "venda do ano passado" : "venda do mês atual", 1000);
      ({ error } = await sb.rpc("admin_registrar_upload_vendas", { p_origem: origem, p_linhas: p.rows.length, p_arquivo: p.name, p_meses: p.meses.map(mesBR).join(", ") })); if (error) throw error;
      st.textContent = ""; showMsg(el("vdMsg_" + origem), `Base atualizada com ${fmtInt.format(p.rows.length)} linhas.`, "ok");
      toast("Planilha importada.");
      parsedVd[origem] = null;
      setTimeout(renderMetas, 1500);
    } catch (err) {
      st.textContent = ""; showMsg(el("vdMsg_" + origem), "Erro: " + err.message + " — a base pode estar incompleta; envie a planilha novamente.", "err");
      btn.disabled = false;
    }
  }

  function agenteOnline(a) { return a?.ultimo_sinal && (Date.now() - new Date(a.ultimo_sinal).getTime()) < 3 * 60 * 1000; }
  function rotinasDoAgente(a) {
    const m = String(a?.versao || "").match(/rotinas:\s*(.+)$/);
    return m ? m[1].split(",").map((x) => x.trim()).filter(Boolean) : null;
  }
  const fpDe = (s) => String(s || "").split(".")[0];

  async function cifrarSenhaOracle(senha, chavePublica) {
    const [fp, b64] = String(chavePublica).split(".");
    const der = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("spki", der, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, key, new TextEncoder().encode(senha)));
    let bin = ""; ct.forEach((b) => bin += String.fromCharCode(b));
    return fp + "." + btoa(bin);
  }

      sb.from("integracao_log").select("*").order("inicio", { ascending: false }).limit(200),

    const err = c.error || a.error || l.error;
    if (err) throw err;
    integ = { cfg: c.data || { id: 1, rotinas: {}, porta: 1521, modo: "thin", intervalo_min: 60, hora_inicio: 6, hora_fim: 20, ativo: true }, agente: a.data, logs: l.data || [] };

              <td style="font-size:13px">${ok ? `${fmtDT(ok.inicio)} <span class="muted">(${tempoAtras(ok.inicio)})</span><div class="muted">${fmtInt.format(ok.linhas || 0)} registros</div>` : `<span class="muted">nunca</span>`}
                ${ul && ul.status === "erro" ? `<div><span class="badge bad" title="${esc(ul.mensagem || "")}">erro ${fmtDT(ul.inicio)}</span></div>` : ""}

          <button class="btn" id="igSalvarRot">Salvar rotinas e horários</button>
          <button class="btn ghost" id="igSyncTodas">Sincronizar todas agora</button>
          <span class="muted" id="igRotStatus" style="font-size:13px"></span>
        </div>
      </div>

      ${cardAppCampo()}
      ${cardFusion()}
      ${cardConector("promotor_rede", "Promotor na Rede — visitas, fotos e contagem", "Visitas do promotor do dia (chegada/saída), link das fotos e contagem de estoque das lojas.")}

        <h2>Histórico</h2>

          <thead><tr><th>Início</th><th>Rotina</th><th>Origem</th><th>Situação</th><th class="num">Registros</th><th>Detalhe</th></tr></thead>

            const r = INTEG_ROTINAS.find((x) => x.id === l.rotina);

              <td><span class="badge ${b}">${esc(l.status)}</span></td><td class="num">${l.linhas != null ? fmtInt.format(l.linhas) : ""}</td>
              <td style="font-size:12.5px;max-width:420px;white-space:normal">${esc(l.mensagem || "")}</td></tr>`; }).join("") || `<tr><td colspan="6" class="empty">Nenhuma sincronização ainda.</td></tr>`}

    el("igRecarregar").onclick = renderInteg;

      try {
        if (el("igSenha").value || !integ.cfg.senha_cifrada) await salvarConexao(true);

  // ---------- App de campo (app_config) ----------
  let appCfg = {};
  function cardAppCampo() {
    const c = appCfg;
    return `<div class="card card-pad" style="margin-bottom:16px">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">App de campo (vendedor e supervisor)</h2><a class="btn ghost sm" href="app.html" target="_blank">Abrir o app ↗</a></div>
        <p class="sub">Presença automática nas lojas (sem check-in) e alertas do supervisor. O agente envia os resumos nos horários abaixo, nos dias úteis.</p>
        <div class="form-grid">
          <div class="field"><label>Raio da loja (metros)</label><input type="number" id="acRaio" value="${esc(c.raio_padrao_m ?? 80)}"></div>
          <div class="field"><label>Permanência para contar visita (min)</label><input type="number" id="acPerm" step="0.5" value="${esc(c.permanencia_min ?? 3)}"></div>
          <div class="field"><label>Localização: das (hora)</label><input type="number" id="acIni" value="${esc(c.hora_inicio ?? 6)}"></div>

          <div class="field"><label>Horários dos alertas</label><input type="text" id="acAlertas" value="${esc(c.alertas_horarios ?? "07:00,11:50,16:50")}"></div>

          <div class="field"><label>Notificações push</label><div class="sub" style="margin:8px 0 0">${c.vapid_public ? `<span class="badge ok">prontas</span>` : `<span class="badge gray">aguardando o agente</span>`}</div></div>
        </div>
        <div id="acMsg"></div>
        <div class="row" style="margin-top:6px"><button class="btn" id="acSalvar">Salvar app de campo</button></div>

  function ligarAppCampo() {
    el("acSalvar").onclick = async () => {
      const dados = { id: 1, raio_padrao_m: Number(el("acRaio").value) || 80, permanencia_min: Number(el("acPerm").value) || 3,
        hora_inicio: Number(el("acIni").value) || 0, hora_fim: Number(el("acFim").value) || 24, dias_uteis: el("acDias").value.trim() || "1,2,3,4,5,6",

        meta_visitas_dia: el("acMetaVis").value ? Number(el("acMetaVis").value) : null, atualizado_em: new Date().toISOString() };
      const { error } = await sb.from("app_config").upsert(dados);
      if (error) return showMsg(el("acMsg"), /does not exist|schema cache/i.test(error.message) ? "Execute schema_app.sql no Supabase primeiro." : error.message, "err");

  // ---------- Fusion: banco Oracle direto (entregas) ----------
  const FUSION_PADRAO = { host: "142.0.64.10", porta: 1521, servico: "C14OUE_137603_W_high.paas.oracle.com", servico_alt: "C14OUE_137603_W_low.paas.oracle.com", usuario: "FUSIONT", schema: "FUSIONT", dias: 15, intervalo_min: 5 };
  function cardFusion() {
    const c = { ...FUSION_PADRAO, ...(integ.cfg.fusion || {}) };
    const direto = c.modo === "oracle";
    const ult = (integ.logs || []).find((l) => l.rotina === "fusion");
    return `<div class="card card-pad" style="margin-bottom:16px">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">Fusion — entregas (banco de dados)</h2>
          ${direto && c.ativo ? `<span class="badge ok">direto no Oracle do Fusion</span>` : c.arquivo && c.ativo ? `<span class="badge warn">lendo o arquivo do BI</span>` : `<span class="badge gray">desligado</span>`}</div>
        <p class="sub">O agente consulta o Oracle do Fusion (FUSIONTRAK_INT_CARGA, CARGA_ENT e EVENTOS) e atualiza as entregas do app: em rota, entregue, não entregue e ocorrência. Cliente e motorista são completados pelo Winthor. A senha é criptografada neste navegador com a chave do agente.</p>
        <div class="form-grid">
          <div class="field"><label>Servidor</label><input type="text" id="fuHost" value="${esc(c.host)}"></div>
          <div class="field"><label>Porta</label><input type="number" id="fuPorta" value="${esc(c.porta)}"></div>
          <div class="field" style="grid-column:span 2"><label>Serviço</label><input type="text" id="fuServ" value="${esc(c.servico)}"></div>
          <div class="field" style="grid-column:span 2"><label>Serviço alternativo (se o principal falhar)</label><input type="text" id="fuServAlt" value="${esc(c.servico_alt || "")}"></div>
          <div class="field"><label>Usuário</label><input type="text" id="fuUser" value="${esc(c.usuario)}" autocomplete="off"></div>
          <div class="field"><label>Schema (dono das tabelas)</label><input type="text" id="fuSchema" value="${esc(c.schema)}"></div>
          <div class="field"><label>Senha do Fusion</label><input type="password" id="fuSenha" autocomplete="new-password" placeholder="${c.senha_cifrada ? "•••••• salva (em branco = manter)" : "não definida"}"></div>
          <div class="field"><label>Dias de histórico</label><input type="number" id="fuDias" value="${esc(c.dias)}"></div>
          <div class="field"><label>Atualizar a cada (min)</label><input type="number" id="fuInt" value="${esc(c.intervalo_min)}"></div>
          <div class="field"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="fuAtivo" ${c.ativo ? "checked" : ""}> Ligado</label></div>
        </div>
        ${ult ? `<div class="sub" style="margin:4px 0 8px">Última atualização: ${fmtDT(ult.inicio)} — ${ult.status === "erro" ? `<span style="color:var(--bad)">${esc(ult.mensagem || "erro")}</span>` : esc(ult.mensagem || ult.status || "")}</div>` : ""}
        <div id="fuMsg"></div>
        <div class="row" style="margin-top:6px;gap:8px;flex-wrap:wrap">
          <button class="btn" id="fuSalvar">Salvar Fusion</button>
          <button class="btn ghost" id="fuTestar">Testar conexão</button>
          <button class="btn ghost" id="fuSync">Sincronizar agora</button>
          <span class="muted" id="fuStatus"></span>
        </div>
      </div>`;
  }
  function ligarFusion() {
    const msg = el("fuMsg");
    el("fuSalvar").onclick = async () => {
      try {
        const atual = integ.cfg.fusion || {};
        const c = { ...atual, modo: "oracle", ativo: el("fuAtivo").checked, host: el("fuHost").value.trim(), porta: Number(el("fuPorta").value) || 1521,
          servico: el("fuServ").value.trim(), servico_alt: el("fuServAlt").value.trim(), usuario: el("fuUser").value.trim(), schema: el("fuSchema").value.trim() || el("fuUser").value.trim(),
          dias: Number(el("fuDias").value) || 15, intervalo_min: Number(el("fuInt").value) || 5 };
        delete c.arquivo; delete c.url;
        const senha = el("fuSenha").value;
        if (senha) {
          if (!integ.agente?.chave_publica) throw new Error("Inicie o agente antes de salvar a senha (ela é criptografada com a chave do agente).");
          c.senha_cifrada = await cifrarSenhaOracle(senha, integ.agente.chave_publica);
        }
        if (c.ativo && !c.senha_cifrada) throw new Error("Informe a senha do Fusion para ligar a integração.");
        if (!c.host || !c.servico || !c.usuario) throw new Error("Preencha servidor, serviço e usuário.");
        const { error } = await sb.from("integracao_config").update({ fusion: c, atualizado_em: new Date().toISOString() }).eq("id", 1);
        if (error) throw new Error(/column|schema cache/i.test(error.message) ? "Execute schema_app.sql no Supabase primeiro." : error.message);
        integ.cfg.fusion = c; el("fuSenha").value = "";
        showMsg(msg, "Fusion salvo. O agente passa a consultar o banco do Fusion direto no próximo ciclo (sem depender do BI).", "ok");
      } catch (e) { showMsg(msg, e.message, "err"); }
    };
    el("fuTestar").onclick = () => enviarComando("testar", "fusion", el("fuStatus"), msg).catch((e) => showMsg(msg, e.message, "err"));
    el("fuSync").onclick = () => enviarComando("sincronizar", "fusion", el("fuStatus"), msg).catch((e) => showMsg(msg, e.message, "err"));
  }

  // ---------- Conectores Fusion / Promotor na Rede ----------
  function cardConector(id, titulo, desc) {
    const c = integ.cfg[id] || {};
    const js = (v) => v && Object.keys(v).length ? JSON.stringify(v, null, 1) : "";
    return `<div class="card card-pad" style="margin-bottom:16px">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">${titulo}</h2>${c.ativo ? `<span class="badge ok">ligado</span>` : `<span class="badge gray">desligado</span>`}</div>
        <p class="sub">${desc} O token é criptografado neste navegador com a chave do agente.</p>
        <div class="form-grid">
          <div class="field" style="grid-column:1/-1"><label>URL da API (use {data} para a data de hoje)</label><input type="text" id="cn_${id}_url" value="${esc(c.url || "")}" placeholder="https://api.exemplo.com/entregas?data={data}"></div>
          <div class="field"><label>Token / chave de API</label><input type="password" id="cn_${id}_tok" autocomplete="new-password" placeholder="${c.token_cifrado ? "•••••• salvo (em branco = manter)" : "não definido"}"></div>
          <div class="field"><label>Cabeçalho do token</label><input type="text" id="cn_${id}_hdr" value="${esc(c.token_cabecalho || "Authorization")}"></div>
          <div class="field"><label>Caminho da lista na resposta</label><input type="text" id="cn_${id}_lista" value="${esc(c.lista || "")}" placeholder="ex.: data.items"></div>
          <div class="field"><label>Atualizar a cada (min)</label><input type="number" id="cn_${id}_int" value="${esc(c.intervalo_min || 5)}"></div>
          <div class="field" style="grid-column:1/-1"><label>Mapa de campos (JSON: campo do app → campo da API)</label><textarea id="cn_${id}_mapa" rows="4" style="width:100%;font-family:monospace;font-size:12px" placeholder='{"chave":"id","codcli":"cliente.codigo","status":"situacao"}'>${esc(js(c.mapa))}</textarea></div>
          <div class="field" style="grid-column:1/-1"><label>Tradução de status (JSON: valor da API → status do app)</label><textarea id="cn_${id}_st" rows="2" style="width:100%;font-family:monospace;font-size:12px" placeholder='{"EM ROTA":"em_rota","ENTREGUE":"entregue"}'>${esc(js(c.status))}</textarea></div>
          <div class="field"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="cn_${id}_ativo" ${c.ativo ? "checked" : ""}> Ligado</label></div>
        </div>
        <div id="cn_${id}_msg"></div>
        <div class="row" style="margin-top:6px"><button class="btn" id="cn_${id}_salvar">Salvar conector</button></div>
      </div>`;
  }
  function ligarConector(id) {
    el(`cn_${id}_salvar`).onclick = async () => {
      const msg = el(`cn_${id}_msg`);
      try {
        const atual = integ.cfg[id] || {};
        const lerJson = (x, nome) => { const v = el(x).value.trim(); if (!v) return {}; try { return JSON.parse(v); } catch (_) { throw new Error(`${nome}: JSON inválido.`); } };
        const c = { ...atual, ativo: el(`cn_${id}_ativo`).checked, url: el(`cn_${id}_url`).value.trim(), token_cabecalho: el(`cn_${id}_hdr`).value.trim() || "Authorization",
          lista: el(`cn_${id}_lista`).value.trim(), intervalo_min: Number(el(`cn_${id}_int`).value) || 5, mapa: lerJson(`cn_${id}_mapa`, "Mapa de campos"), status: lerJson(`cn_${id}_st`, "Tradução de status") };
        const tok = el(`cn_${id}_tok`).value;
        if (tok) {
          if (!integ.agente?.chave_publica) throw new Error("Inicie o agente antes de salvar o token (ele é criptografado com a chave do agente).");
          c.token_cifrado = await cifrarSenhaOracle(tok, integ.agente.chave_publica);
        }
        if (c.ativo && !c.url) throw new Error("Informe a URL para ligar o conector.");
        const { error } = await sb.from("integracao_config").update({ [id]: c, atualizado_em: new Date().toISOString() }).eq("id", 1);
        if (error) throw new Error(/column|schema cache/i.test(error.message) ? "Execute schema_app.sql no Supabase primeiro." : error.message);
        integ.cfg[id] = c; el(`cn_${id}_tok`).value = ""; showMsg(msg, "Conector salvo. O agente usa a nova configuração no próximo ciclo.", "ok");
      } catch (e) { showMsg(msg, e.message, "err"); }
    };
  }

  async function salvarConexao(silencioso) {
    const senha = el("igSenha").value;
    const dados = {
      id: 1, host: el("igHost").value.trim(), porta: Number(el("igPorta").value) || 1521, servico: el("igServico").value.trim(),
      usar_sid: el("igSid").checked, usuario: el("igUsuario").value.trim(), modo: el("igModo").value,
      instant_client: el("igIc").value.trim() || null, atualizado_em: new Date().toISOString(), atualizado_por: ctx.session.user.id,
    };
    if (!dados.host || !dados.servico || !dados.usuario) throw new Error("Preencha servidor, service name/SID e usuário.");
    if (senha) {
      if (!integ.agente?.chave_publica) throw new Error("Instale e inicie o agente no computador antes de salvar a senha (a senha é criptografada com a chave dele).");
      dados.senha_cifrada = await cifrarSenhaOracle(senha, integ.agente.chave_publica);
    } else if (!integ.cfg.senha_cifrada) throw new Error("Informe a senha do banco.");
    const { error } = await sb.from("integracao_config").upsert(dados);
    if (error) throw error;
    el("igSenha").value = "";
    Object.assign(integ.cfg, dados);
    if (!silencioso) { showMsg(el("igDbMsg"), "Conexão salva.", "ok"); setTimeout(renderInteg, 1200); }
  }

  async function salvarRotinas() {
    const rotinas = { ...(integ.cfg.rotinas || {}) };
    for (const r of INTEG_ROTINAS) {
      const p = { ativo: document.querySelector(`[data-ig-ativo="${r.id}"]`).checked,
        supervisores: document.querySelector(`[data-ig-sup="${r.id}"]`).value.split(/[,;\s]+/).filter(Boolean).map(Number).filter(Number.isFinite) };
      if (!p.supervisores.length) throw new Error(`Informe ao menos um supervisor na rotina ${r.rotina}.`);
      const f = document.querySelector(`[data-ig-filial="${r.id}"]`), m = document.querySelector(`[data-ig-meses="${r.id}"]`);
      if (f) p.filial = Number(f.value) || 1;
      if (m) p.meses = Number(m.value) || 60;
      if (r.padrao.intervalo_min) p.intervalo_min = (integ.cfg.rotinas?.[r.id]?.intervalo_min) || r.padrao.intervalo_min;
      rotinas[r.id] = p;
    }
    const dados = { id: 1, rotinas, intervalo_min: Math.max(0, Number(el("igIntervalo").value) || 0),
      hora_inicio: Number(el("igIni").value) || 0, hora_fim: Number(el("igFim").value) || 24, ativo: el("igAtivo").checked,
      atualizado_em: new Date().toISOString(), atualizado_por: ctx.session.user.id };
    const { error } = await sb.from("integracao_config").upsert(dados);
    if (error) throw error;
    Object.assign(integ.cfg, dados);
    showMsg(el("igRotMsg"), "Rotinas e horários salvos. As próximas sincronizações usam estes parâmetros.", "ok");
  }

  async function enviarComando(tipo, rotina, statusEl, msgEl) {
    showMsg(msgEl, "");
    if (!agenteOnline(integ.agente)) showMsg(msgEl, "Atenção: o agente está offline — o pedido fica na fila e roda quando ele voltar.", "err");
    const { data, error } = await sb.from("integracao_comandos").insert({ tipo, rotina }).select("id").single();
    if (error) throw error;
    statusEl.innerHTML = `<span class="spinner dark"></span> ${tipo === "testar" ? "Testando conexão…" : "Sincronizando (pode levar alguns minutos)…"}`;
    clearInterval(integPoll);
    const inicio = Date.now();
    integPoll = setInterval(async () => {
      const { data: c } = await sb.from("integracao_comandos").select("*").eq("id", data.id).maybeSingle();
      if (!c) return;
      if (c.status === "ok" || c.status === "erro") {
        clearInterval(integPoll); statusEl.textContent = "";
        showMsg(msgEl, (c.status === "ok" ? "" : "Erro: ") + (c.resultado || "Concluído."), c.status === "ok" ? "ok" : "err");
        msgEl.firstElementChild && (msgEl.firstElementChild.style.whiteSpace = "pre-line");
        setTimeout(async () => { const m = msgEl.innerHTML, st = msgEl.id; await renderInteg(); el(st).innerHTML = m; }, 800);
      } else if (c.status === "pendente" && Date.now() - inicio > 60000) {
        statusEl.textContent = "Aguardando o agente pegar o pedido…";
      }
      if (Date.now() - inicio > 30 * 60 * 1000) clearInterval(integPoll);
    }, 3000);
  }

  // =====================================================================
  //  EQUIPE PRESENTE NA BASE
  // =====================================================================
  async function loadEquipe() {
    el("tab-equipe").innerHTML = `<div class="card card-pad"><span class="spinner dark"></span></div>`;
    const { data, error } = await sb.rpc("listar_equipe");
    if (error) return el("tab-equipe").innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
    const logins = new Map(users.map((u) => [u.role + ":" + (u.role === "vendedor" ? u.cod_vendedor : u.cod_supervisor), u.login]));
    el("tab-equipe").innerHTML = `
      <div class="card card-pad">
        <h2>Vendedores e supervisores presentes na planilha</h2>
        <p class="sub">Use estes códigos ao cadastrar usuários. A coluna "Login" mostra se já existe um usuário vinculado ao código.</p>
        <div class="table-wrap"><table>
          <thead><tr><th class="num">Cód. sup.</th><th>Supervisor</th><th class="num">Cód. vend.</th><th>Vendedor</th><th class="num">Clientes</th><th>Login vendedor</th><th>Login supervisor</th></tr></thead>
          <tbody>${(data || []).map((r) => `
            <tr>
              <td class="num">${r.cod_supervisor ?? ""}</td><td>${esc(r.supervisor || "")}</td>
              <td class="num">${r.cod_vendedor ?? ""}</td><td><b>${esc(r.vendedor || "")}</b></td>
              <td class="num">${fmtInt.format(r.clientes)}</td>
              <td>${logins.get("vendedor:" + r.cod_vendedor) ? `<span class="badge ok">${esc(logins.get("vendedor:" + r.cod_vendedor))}</span>` : `<span class="badge gray">sem usuário</span>`}</td>
              <td>${logins.get("supervisor:" + r.cod_supervisor) ? `<span class="badge ok">${esc(logins.get("supervisor:" + r.cod_supervisor))}</span>` : `<span class="badge gray">sem usuário</span>`}</td>
            </tr>`).join("") || `<tr><td colspan="7" class="empty">Base vazia — carregue a planilha primeiro.</td></tr>`}
          </tbody>
        </table></div>
      </div>`;
  }

  // =====================================================================
  //  USO DA FERRAMENTA
  // =====================================================================
  function tempoAtras(iso) {
    if (!iso) return null;
    const ms = Date.now() - new Date(iso).getTime(), m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (m < 1) return "agora"; if (m < 60) return `${m} min atrás`; if (h < 24) return `${h} h atrás`; if (d === 1) return "ontem"; return `${d} dias atrás`;
  }
  function fmtDT(iso) { const d = new Date(iso); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function badgeAcesso(iso) {
    if (!iso) return `<span class="badge gray">nunca</span>`;
    const d = (Date.now() - new Date(iso).getTime()) / 86400000;
    return `<span class="badge ${d < 1 ? "ok" : d < 7 ? "warn" : "bad"}">${tempoAtras(iso)}</span>`;
  }

  async function loadUso() {
    el("tab-uso").innerHTML = `<div class="card card-pad"><span class="spinner dark"></span></div>`;
    const [{ data: uso, error: e1 }, { data: rec, error: e2 }] = await Promise.all([sb.rpc("admin_uso"), sb.rpc("admin_uso_recente", { limite: 100 })]);
    if (e1 || e2) return el("tab-uso").innerHTML = `<div class="msg err">${esc((e1 || e2).message)}</div>`;
    const dia = 86400000, agora = Date.now();
    const ultimo = (u) => u.ultimo_acesso || u.ultimo_login;
    const ativos = (dias) => uso.filter((u) => ultimo(u) && agora - new Date(ultimo(u)).getTime() < dias * dia).length;
    const nunca = uso.filter((u) => !ultimo(u));
    const consultas30 = uso.reduce((s, u) => s + (+u.consultas_30d || 0), 0);
    const consultasHoje = uso.reduce((s, u) => s + (+u.consultas_hoje || 0), 0);
    const LIMITE_1H = 50; // clientes distintos consultados em 1 hora que disparam o alerta
    const alerta = uso.filter((u) => u.role === "vendedor" && (+u.clientes_1h || 0) >= LIMITE_1H);

    el("tab-uso").innerHTML = `
      ${alerta.length ? `<div class="msg err" style="margin:0 0 16px"><b>⚠ Volume anormal de consultas na última hora:</b> ${alerta.map((u) => `${esc(u.nome)} (${u.clientes_1h} clientes)`).join(", ")}. Pode indicar cópia da carteira — verifique com o vendedor.</div>` : ""}
      <div class="kpis" style="margin:0 0 16px">
        <div class="kpi"><div class="l">Usuários cadastrados</div><div class="v">${uso.length}</div><div class="s">${nunca.length} nunca acessaram</div></div>
        <div class="kpi"><div class="l">Ativos hoje</div><div class="v">${ativos(1)}</div><div class="s">${consultasHoje} consultas hoje</div></div>
        <div class="kpi"><div class="l">Ativos em 7 dias</div><div class="v">${ativos(7)}</div></div>
        <div class="kpi"><div class="l">Ativos em 30 dias</div><div class="v">${ativos(30)}</div><div class="s">${fmtInt.format(consultas30)} consultas no período</div></div>
      </div>

      <div class="card card-pad" style="margin-bottom:16px">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="margin:0">Uso por usuário</h2>
          <div class="row"><input type="search" id="usoFilter" placeholder="Filtrar…" style="max-width:220px"><button class="btn ghost sm" id="usoRefresh">↻ Atualizar</button></div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Usuário</th><th>Perfil</th><th>Último acesso</th><th class="num">Acessos 30d</th><th class="num">Consultas 30d</th><th class="num">Clientes 30d</th><th class="num">Hoje</th><th class="num">Últ. 1h</th><th class="num">Total</th></tr></thead>
          <tbody id="usoBody"></tbody>
        </table></div>
        <p class="muted" style="font-size:12px;margin:10px 0 0">"Acesso" = abertura do sistema (contado no máximo 1x por minuto). "Consulta" = cliente aberto na tela de mix. Último acesso considera também o login pelo Supabase. "Últ. 1h" = clientes distintos consultados na última hora; ${LIMITE_1H} ou mais dispara o alerta de volume.</p>
      </div>

      <div class="card card-pad">
        <h2>Últimas consultas</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Cliente</th></tr></thead>
          <tbody>${(rec || []).map((r) => `
            <tr>
              <td style="white-space:nowrap">${fmtDT(r.criado_em)}<div class="small muted">${tempoAtras(r.criado_em)}</div></td>
              <td><b>${esc(r.nome)}</b><div class="small muted">${esc(r.login)} · ${esc(ROLE_LABEL[r.role] || r.role)}</div></td>
              <td>${r.tipo === "consulta" ? `<span class="badge brand">consulta</span>` : r.tipo === "roteiro" ? `<span class="badge warn">roteiro</span>` : r.tipo === "clientes" ? `<span class="badge warn">clientes</span>` : `<span class="badge gray">acesso</span>`}</td>
              <td>${r.codcli ? `<span class="mono">${r.codcli}</span> ${esc(r.cliente || "")}${r.fantasia ? ` <span class="muted">· ${esc(r.fantasia)}</span>` : ""}` : "—"}</td>
            </tr>`).join("") || `<tr><td colspan="4" class="empty">Nenhum registro ainda.</td></tr>`}
          </tbody>
        </table></div>
      </div>`;

    const renderRows = () => {
      const f = (el("usoFilter").value || "").toLowerCase();
      el("usoBody").innerHTML = uso.filter((u) => !f || u.nome.toLowerCase().includes(f) || u.login.includes(f) || (ROLE_LABEL[u.role] || "").toLowerCase().includes(f)).map((u) => `
        <tr class="${!ultimo(u) ? "muted" : ""}">
          <td><b>${esc(u.nome)}</b><div class="small muted">${esc(u.login)}${u.cod_vendedor != null ? " · vend. " + u.cod_vendedor : ""}${u.cod_supervisor != null && u.role === "supervisor" ? " · sup. " + u.cod_supervisor : ""}</div></td>
          <td><span class="badge ${u.role === "admin" ? "brand" : u.role === "supervisor" ? "warn" : "gray"}">${esc(ROLE_LABEL[u.role])}</span></td>
          <td>${badgeAcesso(ultimo(u))}${ultimo(u) ? `<div class="small muted">${fmtDT(ultimo(u))}</div>` : ""}</td>
          <td class="num">${u.acessos_30d}</td>
          <td class="num"><b>${u.consultas_30d}</b></td>
          <td class="num">${u.clientes_30d}</td>
          <td class="num">${u.consultas_hoje}</td>
          <td class="num">${(+u.clientes_1h || 0) >= LIMITE_1H ? `<span class="badge bad">${u.clientes_1h}</span>` : (u.clientes_1h ?? 0)}</td>
          <td class="num muted">${u.consultas_total}</td>
        </tr>`).join("") || `<tr><td colspan="9" class="empty">Nenhum usuário</td></tr>`;
    };
    el("usoFilter").addEventListener("input", renderRows);
    el("usoRefresh").addEventListener("click", loadUso);
    renderRows();
  }

  await loadUsers();
  renderUpload();
  renderRotas();
  renderMetas();
})();
</script>
</body>
</html>
