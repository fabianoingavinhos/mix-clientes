<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mix Clientes — Administração</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div id="root"></div>

<script>
(async () => {
  const { sb, esc, el, showMsg, fmtInt, ROLE_LABEL, openModal, closeModal, toast } = Mix;
  const ctx = await Mix.requireAuth({ adminOnly: true });
  const root = el("root");

  root.innerHTML = Mix.renderTopbar(ctx.profile, "admin") + `
    <div class="wrap">
      <h1>Administração</h1>
      <p class="sub">Gerencie usuários, permissões e a base de dados do mix.</p>
      <div class="tabs">
        <button class="active" data-tab="users">Usuários</button>
        <button data-tab="upload">Planilha do mix</button>
        <button data-tab="roteiro">Planilha do roteiro</button>
        <button data-tab="equipe">Equipe na base</button>
        <button data-tab="uso">Uso</button>
      </div>
      <div id="tab-users"></div>
      <div id="tab-upload" hidden></div>
      <div id="tab-roteiro" hidden></div>
      <div id="tab-equipe" hidden></div>
      <div id="tab-uso" hidden></div>
    </div>`;
  Mix.bindTopbar();

  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
    ["users", "upload", "roteiro", "equipe", "uso"].forEach((t) => el("tab-" + t).hidden = t !== b.dataset.tab);
    if (b.dataset.tab === "equipe") loadEquipe();
    if (b.dataset.tab === "uso") loadUso();
  }));

  // =====================================================================
  //  USUÁRIOS
  // =====================================================================
  let users = [];
  async function loadUsers() {
    const { data, error } = await sb.from("profiles").select("*").order("role").order("nome");
    if (error) return toast(error.message, "err");
    users = data;
    renderUsers();
  }

  function renderUsers() {
    el("tab-users").innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px">
        <h2>Novo usuário</h2>
        <form id="newUser">
          <div class="form-grid">
            <div class="field"><label>Login *</label><input type="text" id="uLogin" required placeholder="ex: eduardo"></div>
            <div class="field"><label>Nome *</label><input type="text" id="uNome" required></div>
            <div class="field"><label>Senha *</label><input type="text" id="uSenha" required placeholder="mín. 4 caracteres"></div>
            <div class="field"><label>Perfil *</label>
              <select id="uRole"><option value="vendedor">Vendedor</option><option value="supervisor">Supervisor</option><option value="admin">Administrador</option></select></div>
            <div class="field"><label>Cód. vendedor</label><input type="number" id="uVend" placeholder="da planilha"></div>
            <div class="field"><label>Cód. supervisor</label><input type="number" id="uSup" placeholder="da planilha"></div>
          </div>
          <div id="uMsg"></div>
          <button class="btn" type="submit">Criar usuário</button>
          <span class="muted" style="font-size:13px;margin-left:10px">Vendedor precisa do <b>cód. vendedor</b>; supervisor precisa do <b>cód. supervisor</b> (veja a aba "Equipe na base").</span>
        </form>
      </div>

      <div class="card card-pad">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="margin:0">Usuários cadastrados <span class="badge gray">${users.length}</span></h2>
          <input type="search" id="uFilter" placeholder="Filtrar…" style="max-width:240px">
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th class="num">Cód. vend.</th><th class="num">Cód. sup.</th><th>Ações</th></tr></thead>
          <tbody id="uBody"></tbody>
        </table></div>
      </div>`;

    el("newUser").addEventListener("submit", async (e) => {
      e.preventDefault();
      const role = el("uRole").value;
      const payload = {
        p_login: el("uLogin").value.trim().toLowerCase().replace(/\s+/g, ""),
        p_senha: el("uSenha").value, p_nome: el("uNome").value.trim(), p_role: role,
        p_cod_vendedor: el("uVend").value ? +el("uVend").value : null,
        p_cod_supervisor: el("uSup").value ? +el("uSup").value : null,
      };
      if (role === "vendedor" && payload.p_cod_vendedor == null) return showMsg(el("uMsg"), "Informe o código do vendedor.", "err");
      if (role === "supervisor" && payload.p_cod_supervisor == null) return showMsg(el("uMsg"), "Informe o código do supervisor.", "err");
      const { error } = await sb.rpc("admin_criar_usuario", payload);
      if (error) return showMsg(el("uMsg"), error.message, "err");
      toast(`Usuário ${payload.p_login} criado.`);
      e.target.reset();
      loadUsers();
    });
    el("uFilter").addEventListener("input", renderUserRows);
    renderUserRows();
  }

  function renderUserRows() {
    const f = (el("uFilter")?.value || "").toLowerCase();
    const list = users.filter((u) => !f || u.nome.toLowerCase().includes(f) || u.login.includes(f) || (ROLE_LABEL[u.role] || "").toLowerCase().includes(f));
    el("uBody").innerHTML = list.map((u) => `
      <tr>
        <td><b>${esc(u.nome)}</b></td>
        <td class="mono">${esc(u.login)}</td>
        <td><span class="badge ${u.role === "admin" ? "brand" : u.role === "supervisor" ? "warn" : "gray"}">${esc(ROLE_LABEL[u.role])}</span></td>
        <td class="num">${u.cod_vendedor ?? "—"}</td>
        <td class="num">${u.cod_supervisor ?? "—"}</td>
        <td style="white-space:nowrap">
          <button class="btn ghost sm" data-act="senha" data-id="${u.id}">Redefinir senha</button>
          <button class="btn ghost sm" data-act="edit" data-id="${u.id}">Editar</button>
          ${u.id !== ctx.profile.id ? `<button class="btn ghost sm" style="color:var(--bad)" data-act="del" data-id="${u.id}">Excluir</button>` : ""}
        </td>
      </tr>`).join("") || `<tr><td colspan="6" class="empty">Nenhum usuário</td></tr>`;
    el("uBody").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => userAction(b.dataset.act, users.find((u) => u.id === b.dataset.id))));
  }

  function userAction(act, u) {
    if (act === "senha") {
      openModal(`
        <h3>Redefinir senha — ${esc(u.nome)}</h3>
        <div class="field"><label>Nova senha</label><input type="text" id="mSenha" placeholder="mín. 4 caracteres"></div>
        <div id="mMsg"></div>
        <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="mOk">Salvar</button></div>`);
      el("mOk").onclick = async () => {
        const { error } = await sb.rpc("admin_redefinir_senha", { p_user_id: u.id, p_senha: el("mSenha").value });
        if (error) return showMsg(el("mMsg"), error.message, "err");
        closeModal(); toast(`Senha de ${u.login} redefinida.`);
      };
    }
    if (act === "edit") {
      openModal(`
        <h3>Editar — ${esc(u.login)}</h3>
        <div class="field"><label>Nome</label><input type="text" id="mNome" value="${esc(u.nome)}"></div>
        <div class="field"><label>Perfil</label><select id="mRole">
          ${["vendedor", "supervisor", "admin"].map((r) => `<option value="${r}" ${u.role === r ? "selected" : ""}>${ROLE_LABEL[r]}</option>`).join("")}</select></div>
        <div class="form-grid">
          <div class="field"><label>Cód. vendedor</label><input type="number" id="mVend" value="${u.cod_vendedor ?? ""}"></div>
          <div class="field"><label>Cód. supervisor</label><input type="number" id="mSup" value="${u.cod_supervisor ?? ""}"></div>
        </div>
        <div id="mMsg"></div>
        <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="mOk">Salvar</button></div>`);
      el("mOk").onclick = async () => {
        const { error } = await sb.rpc("admin_editar_usuario", {
          p_user_id: u.id, p_nome: el("mNome").value.trim(), p_role: el("mRole").value,
          p_cod_vendedor: el("mVend").value ? +el("mVend").value : null,
          p_cod_supervisor: el("mSup").value ? +el("mSup").value : null,
        });
        if (error) return showMsg(el("mMsg"), error.message, "err");
        closeModal(); toast("Usuário atualizado."); loadUsers();
      };
    }
    if (act === "del") {
      openModal(`
        <h3>Excluir usuário</h3>
        <p>Tem certeza que deseja excluir <b>${esc(u.nome)}</b> (${esc(u.login)})? Esta ação não pode ser desfeita.</p>
        <div id="mMsg"></div>
        <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" id="mOk">Excluir</button></div>`);
      el("mOk").onclick = async () => {
        const { error } = await sb.rpc("admin_excluir_usuario", { p_user_id: u.id });
        if (error) return showMsg(el("mMsg"), error.message, "err");
        closeModal(); toast("Usuário excluído."); loadUsers();
      };
    }
  }

  // =====================================================================
  //  UPLOAD DA PLANILHA
  // =====================================================================
  const COLUMNS = ["codcli","cliente","fantasia","cnpj_cpf","cidade","uf","cod_vendedor","vendedor","cod_supervisor","supervisor",
    "codprod","descricao","embalagem","unidade","codfornec","fornecedor","primeira_compra_periodo","ultima_compra","dias_sem_comprar",
    "qtd_pedidos","qtd_notas","qtd_total_comprada","valor_total_comprado","preco_medio","ultimo_preco_pago","estoque_filial_1",
    "qtd_bloqueada_filial_1","qtd_reservada_filial_1","estoque_disponivel_filial_1","status_ultima_compra"];
  const INT_COLS = new Set(["codcli","cod_vendedor","cod_supervisor","codprod","codfornec","dias_sem_comprar","qtd_pedidos","qtd_notas","estoque_filial_1","qtd_bloqueada_filial_1","qtd_reservada_filial_1","estoque_disponivel_filial_1"]);
  const NUM_COLS = new Set(["qtd_total_comprada","valor_total_comprado","preco_medio","ultimo_preco_pago"]);
  const DATE_COLS = new Set(["primeira_compra_periodo","ultima_compra"]);

  let parsed = null;

  async function renderUpload() {
    const { data: meta } = await sb.from("mix_meta").select("*").eq("id", 1).maybeSingle();
    el("tab-upload").innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px">
        <h2>Base atual</h2>
        ${meta?.atualizado_em
          ? `<p class="sub" style="margin:0">Última atualização em <b>${new Date(meta.atualizado_em).toLocaleString("pt-BR")}</b> — ${fmtInt.format(meta.linhas)} linhas (${esc(meta.arquivo || "")})</p>`
          : `<p class="sub" style="margin:0">Nenhuma planilha carregada ainda.</p>`}
      </div>
      <div class="card card-pad">
        <h2>Carregar nova planilha</h2>
        <div class="msg info" style="margin:0 0 14px">
          <b>Origem da planilha:</b> gere o <b>Relatório 8235</b> no sistema e salve em <b>.csv</b>. Depois carregue o arquivo aqui — a base atual é <b>substituída</b> pela nova.
        </div>
        <p class="sub">Também aceita <b>.xlsx</b> e <b>.xls</b> com as colunas do relatório (CODCLI, CLIENTE, FANTASIA, COD_VENDEDOR, COD_SUPERVISOR, CODPROD…).<br>
        <span class="muted">Evite o .xls antigo: ele corta o relatório em 65.536 linhas. O .csv traz o relatório completo.</span></p>
        <div class="dropzone" id="drop">
          <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
          <div><b>Clique para escolher</b> ou arraste o arquivo aqui</div>
          <div style="font-size:13px;margin-top:4px">xlsx · xls · csv</div>
        </div>
        <div id="upInfo" style="margin-top:14px"></div>
        <div class="progress" id="upProg" hidden><div></div></div>
        <div id="upMsg"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="btnImport" disabled>Substituir base pela planilha</button>
          <span class="muted" id="upStatus" style="font-size:13px"></span>
        </div>
      </div>`;

    const drop = el("drop"), file = el("file");
    drop.addEventListener("click", () => file.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    file.addEventListener("change", () => file.files[0] && handleFile(file.files[0]));
    el("btnImport").addEventListener("click", importRows);
  }

  function normHeader(h) {
    return String(h || "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Z0-9]+/g, "_").replace(/^_|_$/g, "").toLowerCase();
  }

  function toInt(v) { if (v == null || v === "") return null; const n = parseInt(String(v).replace(/\./g, "").replace(",", "."), 10); return isNaN(n) ? null : n; }
  function toNum(v) {
    if (v == null || v === "") return null;
    if (typeof v === "number") return v;
    let s = String(v).trim();
    if (/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); // 1.234,56
    else s = s.replace(",", ".");
    const n = parseFloat(s); return isNaN(n) ? null : n;
  }
  function toDate(v) {
    if (v == null || v === "") return null;
    if (v instanceof Date) return isNaN(v) ? null : `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, "0")}-${String(v.getDate()).padStart(2, "0")}`;
    if (typeof v === "number") { const d = XLSX.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2, "0")}-${String(d.d).padStart(2, "0")}` : null; }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    return null;
  }

  // --- Leitura de CSV própria (aceita ; ou , / com ou sem cabeçalho / latin1 ou utf-8)
  function decodeText(buf) {
    try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
    catch { return new TextDecoder("windows-1252").decode(buf); }
  }
  function parseCsv(text) {
    const firstLine = text.slice(0, text.indexOf("\n") > 0 ? text.indexOf("\n") : text.length);
    const delim = (firstLine.split(";").length >= firstLine.split(",").length) ? ";" : (firstLine.split("\t").length > firstLine.split(",").length ? "\t" : ",");
    const rows = []; let row = [], field = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQ) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === delim) { row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else field += ch;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function readRaw(f, buf) {
    if (/\.(csv|txt)$/i.test(f.name)) return parseCsv(decodeText(buf));
    const wb = XLSX.read(buf, { type: "array", cellDates: true, raw: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
  }

  function handleFile(f) {
    parsed = null; el("btnImport").disabled = true;
    showMsg(el("upMsg"), ""); el("upInfo").innerHTML = `<span class="spinner dark"></span> Lendo ${esc(f.name)}…`;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const raw = readRaw(f, e.target.result);
        if (raw.length < 1) throw new Error("Planilha vazia.");
        // Cabeçalho presente? (primeira célula não numérica e alguma coluna reconhecida)
        const firstHeaders = (raw[0] || []).map(normHeader);
        const hasHeader = firstHeaders.some((h) => COLUMNS.includes(h)) && isNaN(parseInt(String(raw[0][0]), 10));
        const idx = {};
        let semCabecalho = false;
        if (hasHeader) {
          firstHeaders.forEach((h, i) => { if (COLUMNS.includes(h) && idx[h] == null) idx[h] = i; });
        } else {
          // Sem cabeçalho: assume a ordem padrão do relatório (30 colunas)
          const ncols = (raw[0] || []).length;
          if (ncols < 30) throw new Error(`Arquivo sem cabeçalho com ${ncols} colunas — esperado 30 colunas na ordem padrão do relatório, ou uma linha de cabeçalho.`);
          COLUMNS.forEach((c, i) => idx[c] = i);
          semCabecalho = true;
        }
        const missing = ["codcli", "cliente", "cod_vendedor", "cod_supervisor", "codprod", "descricao"].filter((c) => idx[c] == null);
        if (missing.length) throw new Error("Colunas obrigatórias não encontradas: " + missing.join(", ").toUpperCase());
        const found = Object.keys(idx);
        const rows = [];
        for (let i = hasHeader ? 1 : 0; i < raw.length; i++) {
          const r = raw[i]; if (!r || r[idx.codcli] == null || r[idx.codcli] === "") continue;
          const o = {};
          for (const c of found) {
            let v = r[idx[c]];
            if (INT_COLS.has(c)) v = toInt(v);
            else if (NUM_COLS.has(c)) v = toNum(v);
            else if (DATE_COLS.has(c)) v = toDate(v);
            else v = v == null ? null : String(v).trim();
            o[c] = v;
          }
          if (o.codcli == null || o.codprod == null) continue;
          rows.push(o);
        }
        if (!rows.length) throw new Error("Nenhuma linha válida encontrada.");
        const clientes = new Set(rows.map((r) => r.codcli)).size;
        const vend = new Set(rows.map((r) => r.cod_vendedor)).size;
        const sup = new Set(rows.map((r) => r.cod_supervisor)).size;
        parsed = { rows, name: f.name };
        const ex = rows[0];
        el("upInfo").innerHTML = `
          <div class="kpis" style="margin:0">
            <div class="kpi"><div class="l">Linhas</div><div class="v">${fmtInt.format(rows.length)}</div></div>
            <div class="kpi"><div class="l">Clientes</div><div class="v">${fmtInt.format(clientes)}</div></div>
            <div class="kpi"><div class="l">Vendedores</div><div class="v">${vend}</div></div>
            <div class="kpi"><div class="l">Supervisores</div><div class="v">${sup}</div></div>
          </div>
          <div class="muted" style="font-size:13px;margin-top:8px">
            ${semCabecalho ? "Arquivo sem cabeçalho — usada a ordem padrão das 30 colunas. " : ""}Colunas reconhecidas: ${found.length}/${COLUMNS.length}${found.length < COLUMNS.length ? " (faltando: " + COLUMNS.filter((c) => !found.includes(c)).join(", ") + ")" : ""}<br>
            Conferência da 1ª linha: <b>${esc(ex.cliente)}</b> · vendedor ${esc(ex.vendedor || "")} (${ex.cod_vendedor}) · produto ${esc(ex.descricao)} · última compra ${ex.ultima_compra || "—"} · valor ${ex.valor_total_comprado ?? "—"}
          </div>
          ${rows.length === 65535 ? `<div class="msg err">Atenção: exatamente 65.535 linhas — o Excel provavelmente cortou o relatório (limite do .xls). Exporte como .xlsx ou .csv.</div>` : ""}`;
        el("btnImport").disabled = false;
      } catch (err) {
        el("upInfo").innerHTML = ""; showMsg(el("upMsg"), err.message, "err");
      }
    };
    reader.readAsArrayBuffer(f);
  }

  async function importRows() {
    if (!parsed) return;
    const btn = el("btnImport"); btn.disabled = true;
    const prog = el("upProg"), bar = prog.firstElementChild, st = el("upStatus");
    prog.hidden = false; bar.style.width = "0%"; showMsg(el("upMsg"), "");
    try {
      st.textContent = "Limpando base atual…";
      let { error } = await sb.rpc("admin_limpar_mix"); if (error) throw error;
      const rows = parsed.rows, BATCH = 1000;
      for (let i = 0; i < rows.length; i += BATCH) {
        const chunk = rows.slice(i, i + BATCH);
        let tries = 0;
        while (true) {
          const { error } = await sb.from("mix").insert(chunk);
          if (!error) break;
          if (++tries >= 3) throw error;
          await new Promise((r) => setTimeout(r, 1200));
        }
        const done = Math.min(i + BATCH, rows.length);
        bar.style.width = Math.round((done / rows.length) * 100) + "%";
        st.textContent = `Enviando ${fmtInt.format(done)} / ${fmtInt.format(rows.length)} linhas…`;
      }
      ({ error } = await sb.rpc("admin_registrar_upload", { p_linhas: rows.length, p_arquivo: parsed.name })); if (error) throw error;
      st.textContent = ""; showMsg(el("upMsg"), `Base atualizada com ${fmtInt.format(rows.length)} linhas.`, "ok");
      toast("Planilha importada com sucesso.");
      parsed = null;
      setTimeout(renderUpload, 1500);
    } catch (err) {
      st.textContent = ""; showMsg(el("upMsg"), "Erro: " + err.message + " — a base pode estar incompleta; envie a planilha novamente.", "err");
      btn.disabled = false;
    }
  }

  // =====================================================================
  //  UPLOAD DA PLANILHA DE ROTEIRO (promotores x dia de visita)
  // =====================================================================
  // Cabeçalho do relatório -> coluna da tabela "roteiro"
  const RT_MAP = {
    cod_supervisor: "cod_supervisor", supervisor: "supervisor", cod_sup_promotor: "cod_sup_promotor", supervisor_promotor: "supervisor_promotor",
    cod_rca: "cod_vendedor", rca: "vendedor", cod_vendedor: "cod_vendedor", vendedor: "vendedor",
    cod_promotor: "cod_promotor", promotor: "promotor", codcli: "codcli", cliente: "cliente", fantasia: "fantasia", cnpj_cpf: "cnpj_cpf",
    endereco: "endereco", numero: "numero", bairro: "bairro", cidade: "cidade", uf: "uf",
    data_ultima_compra: "ultima_compra", ultima_compra: "ultima_compra", dias_sem_compra: "dias_sem_comprar", dias_sem_comprar: "dias_sem_comprar",
    dia_semana_cadastrado: "dia_semana_cadastrado", dia_semana: "dia_semana", data_proxima_visita: "proxima_visita", proxima_visita: "proxima_visita",
    dia_calculado_data: "dia_calculado", horario_visita: "horario_visita", sequencia_visita: "sequencia_visita", periodicidade: "periodicidade",
    numero_semana: "numero_semana", ciclo_visita: "ciclo_visita", dia_fixo: "dia_fixo", data_inicio_rota: "data_inicio_rota", data_final_rota: "data_final_rota",
    ultima_visita_prevista: "ultima_visita_prevista", data_referencia: "data_referencia", zona: "zona", observacao: "observacao", qtd_clientes_promotor: "qtd_clientes_promotor",
  };
  // Ordem padrão do relatório quando vier sem cabeçalho (39 colunas + coluna vazia final)
  const RT_ORDER = ["cod_supervisor","supervisor","cod_sup_promotor","supervisor_promotor","cod_rca","rca","cod_promotor","promotor","codcli","cliente","fantasia","cnpj_cpf",
    "endereco","numero","bairro","cidade","uf","data_ultima_compra","dias_sem_compra","dia_semana_cadastrado","dia_semana","data_proxima_visita","data_visita_formatada",
    "dia_calculado_data","hora_visita","minuto_visita","horario_visita","sequencia_visita","periodicidade","numero_semana","ciclo_visita","dia_fixo","data_inicio_rota",
    "data_final_rota","ultima_visita_prevista","data_referencia","zona","observacao","qtd_clientes_promotor"];
  const RT_INT = new Set(["cod_supervisor","cod_sup_promotor","cod_vendedor","cod_promotor","codcli","dias_sem_comprar","sequencia_visita","periodicidade","numero_semana","qtd_clientes_promotor"]);
  const RT_DATE = new Set(["ultima_compra","proxima_visita","data_inicio_rota","data_final_rota","ultima_visita_prevista","data_referencia"]);

  let parsedRt = null;

  async function renderRoteiro() {
    const { data: meta } = await sb.from("roteiro_meta").select("*").eq("id", 1).maybeSingle();
    el("tab-roteiro").innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px">
        <h2>Roteiro atual</h2>
        ${meta?.atualizado_em
          ? `<p class="sub" style="margin:0">Última atualização em <b>${new Date(meta.atualizado_em).toLocaleString("pt-BR")}</b> — ${fmtInt.format(meta.linhas)} linhas (${esc(meta.arquivo || "")})</p>`
          : `<p class="sub" style="margin:0">Nenhum roteiro carregado ainda. <span class="muted">Se aparecer erro ao carregar, execute o arquivo <span class="mono">schema_roteiro.sql</span> no SQL Editor do Supabase.</span></p>`}
      </div>
      <div class="card card-pad">
        <h2>Carregar novo roteiro</h2>
        <div class="msg info" style="margin:0 0 14px">
          <b>Origem do roteiro:</b> gere o relatório na <b>rotina 8236</b> (promotores x dia de visita) e exporte em <b>.csv</b>, com cabeçalho (COD_SUPERVISOR, COD_RCA, COD_PROMOTOR, CODCLI, DATA_PROXIMA_VISITA, PERIODICIDADE…). Depois carregue o arquivo aqui — o roteiro atual é <b>substituído</b> pelo novo.
        </div>
        <p class="sub">A permissão segue a mesma regra do mix: vendedor vê as lojas do seu <b>COD_RCA</b>; supervisor vê as lojas do seu <b>COD_SUPERVISOR</b>; admin vê tudo.</p>
        <div class="dropzone" id="rtDrop">
          <input type="file" id="rtFile" accept=".xlsx,.xls,.csv" hidden>
          <div><b>Clique para escolher</b> ou arraste o arquivo aqui</div>
          <div style="font-size:13px;margin-top:4px">xlsx · xls · csv</div>
        </div>
        <div id="rtInfo" style="margin-top:14px"></div>
        <div class="progress" id="rtProg" hidden><div></div></div>
        <div id="rtMsg"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="rtImport" disabled>Substituir roteiro pela planilha</button>
          <span class="muted" id="rtStatus" style="font-size:13px"></span>
        </div>
      </div>`;

    const drop = el("rtDrop"), file = el("rtFile");
    drop.addEventListener("click", () => file.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) handleRoteiroFile(e.dataTransfer.files[0]); });
    file.addEventListener("change", () => file.files[0] && handleRoteiroFile(file.files[0]));
    el("rtImport").addEventListener("click", importRoteiro);
  }

  function parseRoteiroRows(raw) {
    const first = (raw[0] || []).map(normHeader);
    const hasHeader = first.some((h) => RT_MAP[h]) && isNaN(parseInt(String(raw[0][0]), 10));
    const idx = {}; // coluna da tabela -> índice no arquivo
    if (hasHeader) first.forEach((h, i) => { const c = RT_MAP[h]; if (c && idx[c] == null) idx[c] = i; });
    else {
      const ncols = (raw[0] || []).length;
      if (ncols < RT_ORDER.length) throw new Error(`Arquivo sem cabeçalho com ${ncols} colunas — esperado ${RT_ORDER.length} na ordem padrão do relatório, ou uma linha de cabeçalho.`);
      RT_ORDER.forEach((h, i) => { const c = RT_MAP[h]; if (c && idx[c] == null) idx[c] = i; });
    }
    const missing = ["codcli", "cod_vendedor", "cod_promotor"].filter((c) => idx[c] == null);
    if (missing.length) throw new Error("Colunas obrigatórias não encontradas: " + missing.join(", ").toUpperCase());
    const found = Object.keys(idx), rows = [];
    for (let i = hasHeader ? 1 : 0; i < raw.length; i++) {
      const r = raw[i]; if (!r || r[idx.codcli] == null || r[idx.codcli] === "") continue;
      const o = {};
      for (const c of found) {
        let v = r[idx[c]];
        if (RT_INT.has(c)) v = toInt(v);
        else if (RT_DATE.has(c)) v = toDate(v);
        else { v = v == null ? null : String(v).trim(); if (v === "") v = null; }
        o[c] = v;
      }
      if (o.codcli == null) continue;
      rows.push(o);
    }
    return { rows, found, semCabecalho: !hasHeader };
  }

  function handleRoteiroFile(f) {
    parsedRt = null; el("rtImport").disabled = true;
    showMsg(el("rtMsg"), ""); el("rtInfo").innerHTML = `<span class="spinner dark"></span> Lendo ${esc(f.name)}…`;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const raw = readRaw(f, e.target.result);
        if (raw.length < 1) throw new Error("Planilha vazia.");
        const { rows, found, semCabecalho } = parseRoteiroRows(raw);
        if (!rows.length) throw new Error("Nenhuma linha válida encontrada.");
        const lojas = new Set(rows.map((r) => r.codcli)).size;
        const prom = new Set(rows.map((r) => r.cod_promotor)).size;
        const vend = new Set(rows.map((r) => r.cod_vendedor)).size;
        const sup = new Set(rows.map((r) => r.cod_supervisor)).size;
        const comRota = rows.filter((r) => r.proxima_visita).length;
        const semSup = rows.filter((r) => r.cod_supervisor == null).length;
        parsedRt = { rows, name: f.name };
        const ex = rows.find((r) => r.proxima_visita) || rows[0];
        el("rtInfo").innerHTML = `
          <div class="kpis" style="margin:0">
            <div class="kpi"><div class="l">Linhas</div><div class="v">${fmtInt.format(rows.length)}</div><div class="s">${fmtInt.format(comRota)} com próxima visita</div></div>
            <div class="kpi"><div class="l">Lojas</div><div class="v">${fmtInt.format(lojas)}</div></div>
            <div class="kpi"><div class="l">Promotores</div><div class="v">${prom}</div></div>
            <div class="kpi"><div class="l">Vendedores</div><div class="v">${vend}</div><div class="s">${sup} supervisores</div></div>
          </div>
          <div class="muted" style="font-size:13px;margin-top:8px">
            ${semCabecalho ? "Arquivo sem cabeçalho — usada a ordem padrão do relatório. " : ""}Colunas reconhecidas: ${found.length}<br>
            Conferência: <b>${esc(ex.fantasia || ex.cliente)}</b> · promotor ${esc(ex.promotor || "")} (${ex.cod_promotor}) · vendedor ${esc(ex.vendedor || "")} (${ex.cod_vendedor}) · supervisor ${ex.cod_supervisor ?? "—"} · próxima visita ${ex.proxima_visita || "—"} · a cada ${ex.periodicidade ?? "—"} dias
          </div>
          ${semSup ? `<div class="msg err">${semSup} linhas sem COD_SUPERVISOR — essas lojas não aparecerão para supervisores (só para admin e para o vendedor).</div>` : ""}`;
        el("rtImport").disabled = false;
      } catch (err) {
        el("rtInfo").innerHTML = ""; showMsg(el("rtMsg"), err.message, "err");
      }
    };
    reader.readAsArrayBuffer(f);
  }

  async function importRoteiro() {
    if (!parsedRt) return;
    const btn = el("rtImport"); btn.disabled = true;
    const prog = el("rtProg"), bar = prog.firstElementChild, st = el("rtStatus");
    prog.hidden = false; bar.style.width = "0%"; showMsg(el("rtMsg"), "");
    try {
      st.textContent = "Limpando roteiro atual…";
      let { error } = await sb.rpc("admin_limpar_roteiro"); if (error) throw error;
      const rows = parsedRt.rows, BATCH = 500;
      for (let i = 0; i < rows.length; i += BATCH) {
        const chunk = rows.slice(i, i + BATCH);
        let tries = 0;
        while (true) {
          const { error } = await sb.from("roteiro").insert(chunk);
          if (!error) break;
          if (++tries >= 3) throw error;
          await new Promise((r) => setTimeout(r, 1200));
        }
        const done = Math.min(i + BATCH, rows.length);
        bar.style.width = Math.round((done / rows.length) * 100) + "%";
        st.textContent = `Enviando ${fmtInt.format(done)} / ${fmtInt.format(rows.length)} linhas…`;
      }
      ({ error } = await sb.rpc("admin_registrar_upload_roteiro", { p_linhas: rows.length, p_arquivo: parsedRt.name })); if (error) throw error;
      st.textContent = ""; showMsg(el("rtMsg"), `Roteiro atualizado com ${fmtInt.format(rows.length)} linhas.`, "ok");
      toast("Roteiro importado com sucesso.");
      parsedRt = null;
      setTimeout(renderRoteiro, 1500);
    } catch (err) {
      st.textContent = ""; showMsg(el("rtMsg"), "Erro: " + err.message + " — o roteiro pode estar incompleto; envie a planilha novamente.", "err");
      btn.disabled = false;
    }
  }

  // =====================================================================
  //  EQUIPE PRESENTE NA BASE
  // =====================================================================
  async function loadEquipe() {
    el("tab-equipe").innerHTML = `<div class="card card-pad"><span class="spinner dark"></span></div>`;
    const { data, error } = await sb.rpc("listar_equipe");
    if (error) return el("tab-equipe").innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
    const logins = new Map(users.map((u) => [u.role + ":" + (u.role === "vendedor" ? u.cod_vendedor : u.cod_supervisor), u.login]));
    el("tab-equipe").innerHTML = `
      <div class="card card-pad">
        <h2>Vendedores e supervisores presentes na planilha</h2>
        <p class="sub">Use estes códigos ao cadastrar usuários. A coluna "Login" mostra se já existe um usuário vinculado ao código.</p>
        <div class="table-wrap"><table>
          <thead><tr><th class="num">Cód. sup.</th><th>Supervisor</th><th class="num">Cód. vend.</th><th>Vendedor</th><th class="num">Clientes</th><th>Login vendedor</th><th>Login supervisor</th></tr></thead>
          <tbody>${(data || []).map((r) => `
            <tr>
              <td class="num">${r.cod_supervisor ?? ""}</td><td>${esc(r.supervisor || "")}</td>
              <td class="num">${r.cod_vendedor ?? ""}</td><td><b>${esc(r.vendedor || "")}</b></td>
              <td class="num">${fmtInt.format(r.clientes)}</td>
              <td>${logins.get("vendedor:" + r.cod_vendedor) ? `<span class="badge ok">${esc(logins.get("vendedor:" + r.cod_vendedor))}</span>` : `<span class="badge gray">sem usuário</span>`}</td>
              <td>${logins.get("supervisor:" + r.cod_supervisor) ? `<span class="badge ok">${esc(logins.get("supervisor:" + r.cod_supervisor))}</span>` : `<span class="badge gray">sem usuário</span>`}</td>
            </tr>`).join("") || `<tr><td colspan="7" class="empty">Base vazia — carregue a planilha primeiro.</td></tr>`}
          </tbody>
        </table></div>
      </div>`;
  }

  // =====================================================================
  //  USO DA FERRAMENTA
  // =====================================================================
  function tempoAtras(iso) {
    if (!iso) return null;
    const ms = Date.now() - new Date(iso).getTime(), m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (m < 1) return "agora"; if (m < 60) return `${m} min atrás`; if (h < 24) return `${h} h atrás`; if (d === 1) return "ontem"; return `${d} dias atrás`;
  }
  function fmtDT(iso) { const d = new Date(iso); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  function badgeAcesso(iso) {
    if (!iso) return `<span class="badge gray">nunca</span>`;
    const d = (Date.now() - new Date(iso).getTime()) / 86400000;
    return `<span class="badge ${d < 1 ? "ok" : d < 7 ? "warn" : "bad"}">${tempoAtras(iso)}</span>`;
  }

  async function loadUso() {
    el("tab-uso").innerHTML = `<div class="card card-pad"><span class="spinner dark"></span></div>`;
    const [{ data: uso, error: e1 }, { data: rec, error: e2 }] = await Promise.all([sb.rpc("admin_uso"), sb.rpc("admin_uso_recente", { limite: 100 })]);
    if (e1 || e2) return el("tab-uso").innerHTML = `<div class="msg err">${esc((e1 || e2).message)}</div>`;
    const dia = 86400000, agora = Date.now();
    const ultimo = (u) => u.ultimo_acesso || u.ultimo_login;
    const ativos = (dias) => uso.filter((u) => ultimo(u) && agora - new Date(ultimo(u)).getTime() < dias * dia).length;
    const nunca = uso.filter((u) => !ultimo(u));
    const consultas30 = uso.reduce((s, u) => s + (+u.consultas_30d || 0), 0);
    const consultasHoje = uso.reduce((s, u) => s + (+u.consultas_hoje || 0), 0);

    el("tab-uso").innerHTML = `
      <div class="kpis" style="margin:0 0 16px">
        <div class="kpi"><div class="l">Usuários cadastrados</div><div class="v">${uso.length}</div><div class="s">${nunca.length} nunca acessaram</div></div>
        <div class="kpi"><div class="l">Ativos hoje</div><div class="v">${ativos(1)}</div><div class="s">${consultasHoje} consultas hoje</div></div>
        <div class="kpi"><div class="l">Ativos em 7 dias</div><div class="v">${ativos(7)}</div></div>
        <div class="kpi"><div class="l">Ativos em 30 dias</div><div class="v">${ativos(30)}</div><div class="s">${fmtInt.format(consultas30)} consultas no período</div></div>
      </div>

      <div class="card card-pad" style="margin-bottom:16px">
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="margin:0">Uso por usuário</h2>
          <div class="row"><input type="search" id="usoFilter" placeholder="Filtrar…" style="max-width:220px"><button class="btn ghost sm" id="usoRefresh">↻ Atualizar</button></div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Usuário</th><th>Perfil</th><th>Último acesso</th><th class="num">Acessos 30d</th><th class="num">Consultas 30d</th><th class="num">Clientes 30d</th><th class="num">Hoje</th><th class="num">Total</th></tr></thead>
          <tbody id="usoBody"></tbody>
        </table></div>
        <p class="muted" style="font-size:12px;margin:10px 0 0">"Acesso" = abertura do sistema (contado no máximo 1x por minuto). "Consulta" = cliente aberto na tela de mix. Último acesso considera também o login pelo Supabase.</p>
      </div>

      <div class="card card-pad">
        <h2>Últimas consultas</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Cliente</th></tr></thead>
          <tbody>${(rec || []).map((r) => `
            <tr>
              <td style="white-space:nowrap">${fmtDT(r.criado_em)}<div class="small muted">${tempoAtras(r.criado_em)}</div></td>
              <td><b>${esc(r.nome)}</b><div class="small muted">${esc(r.login)} · ${esc(ROLE_LABEL[r.role] || r.role)}</div></td>
              <td>${r.tipo === "consulta" ? `<span class="badge brand">consulta</span>` : r.tipo === "roteiro" ? `<span class="badge warn">roteiro</span>` : `<span class="badge gray">acesso</span>`}</td>
              <td>${r.codcli ? `<span class="mono">${r.codcli}</span> ${esc(r.cliente || "")}${r.fantasia ? ` <span class="muted">· ${esc(r.fantasia)}</span>` : ""}` : "—"}</td>
            </tr>`).join("") || `<tr><td colspan="4" class="empty">Nenhum registro ainda.</td></tr>`}
          </tbody>
        </table></div>
      </div>`;

    const renderRows = () => {
      const f = (el("usoFilter").value || "").toLowerCase();
      el("usoBody").innerHTML = uso.filter((u) => !f || u.nome.toLowerCase().includes(f) || u.login.includes(f) || (ROLE_LABEL[u.role] || "").toLowerCase().includes(f)).map((u) => `
        <tr class="${!ultimo(u) ? "muted" : ""}">
          <td><b>${esc(u.nome)}</b><div class="small muted">${esc(u.login)}${u.cod_vendedor != null ? " · vend. " + u.cod_vendedor : ""}${u.cod_supervisor != null && u.role === "supervisor" ? " · sup. " + u.cod_supervisor : ""}</div></td>
          <td><span class="badge ${u.role === "admin" ? "brand" : u.role === "supervisor" ? "warn" : "gray"}">${esc(ROLE_LABEL[u.role])}</span></td>
          <td>${badgeAcesso(ultimo(u))}${ultimo(u) ? `<div class="small muted">${fmtDT(ultimo(u))}</div>` : ""}</td>
          <td class="num">${u.acessos_30d}</td>
          <td class="num"><b>${u.consultas_30d}</b></td>
          <td class="num">${u.clientes_30d}</td>
          <td class="num">${u.consultas_hoje}</td>
          <td class="num muted">${u.consultas_total}</td>
        </tr>`).join("") || `<tr><td colspan="8" class="empty">Nenhum usuário</td></tr>`;
    };
    el("usoFilter").addEventListener("input", renderRows);
    el("usoRefresh").addEventListener("click", loadUso);
    renderRows();
  }

  await loadUsers();
  renderUpload();
  renderRoteiro();
})();
</script>
